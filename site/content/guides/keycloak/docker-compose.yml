services:

  polaris:
    image: apache/polaris:latest
    ports:
      # API port
      - "8181:8181"
      # Management port (metrics and health checks)
      - "8182:8182"
      # Optional, allows attaching a debugger to the Polaris JVM
      - "5005:5005"
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      JAVA_DEBUG: true
      JAVA_DEBUG_PORT: "*:5005"
      # In this setup, the "root" service account should only be used for synchronizing
      # real Keycloak users with Polaris principals. It should only call the Polaris Management
      # API, not other APIs like the Iceberg REST one.
      POLARIS_BOOTSTRAP_CREDENTIALS: POLARIS,root,s3cr3t
      # "mixed" is required in this setup because it keeps the internal token endpoint
      # active (needed for the root service account that only exists in Polaris), while also
      # accepting tokens issued by Keycloak (needed for all other Keycloak users).
      polaris.authentication.type: mixed
      quarkus.oidc.tenant-enabled: true
      quarkus.oidc.auth-server-url: http://keycloak:8080/realms/iceberg
      quarkus.oidc.client-id: client1
      # "keycloak-admin" is a real Keycloak user (not a hardcoded claim), authenticated with
      # the "password" grant; its roles and name come from the standard "resource_access" and
      # "preferred_username" claims.
      quarkus.oidc.roles.role-claim-path: resource_access/client1/roles
      # Principals are always matched by name: there is no way to retrieve, ahead of time,
      # the principal ID that Polaris will assign to a newly-created principal, so
      # principal-mapper.id-claim-path is intentionally left unset.
      polaris.oidc.principal-mapper.name-claim-path: preferred_username
      polaris.oidc.principal-roles-mapper.mappings[0].regex: (.+)
      polaris.oidc.principal-roles-mapper.mappings[0].replacement: PRINCIPAL_ROLE:$1
      polaris.features."ALLOW_INSECURE_STORAGE_TYPES": "true"
      polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES": "[\"FILE\",\"S3\",\"GCS\",\"AZURE\"]"
      polaris.readiness.ignore-severe-issues: "true"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8182/q/health"]
      interval: 2s
      timeout: 10s
      retries: 10
      start_period: 10s

  polaris-setup:
    image: alpine/curl:8.22.0
    depends_on:
      polaris:
        condition: service_healthy
    environment:
      - CLIENT_ID=root
      - CLIENT_SECRET=s3cr3t
    volumes:
      - ../assets/polaris/:/polaris
    entrypoint: "/bin/sh"
    # In this setup, the Keycloak user "keycloak-admin" must be synchronized
    # as a Polaris principal before they can be used to contact Polaris.
    # The synchronization is done using the Polaris "root" service account.
    command:
      - "-c"
      - >-
        apk add --no-cache jq &&
        /polaris/create-principal.sh POLARIS keycloak-admin service_admin &&
        keycloak_token=$$(curl --fail-with-body -s http://keycloak:8080/realms/iceberg/protocol/openid-connect/token --user client1:s3cr3t -d 'grant_type=password' -d 'username=keycloak-admin' -d 'password=s3cr3t' | jq -er .access_token) &&
        /polaris/create-catalog.sh POLARIS $$keycloak_token &&
        touch /tmp/polaris-setup-done &&
        tail -f /dev/null
    healthcheck:
      interval: 1s
      timeout: 10s
      retries: 240
      test: ["CMD", "test", "-f", "/tmp/polaris-setup-done"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ../assets/keycloak/iceberg-realm.json:/opt/keycloak/data/import/iceberg-realm.json
    command: [
      "start-dev",
      "--import-realm",
      "--health-enabled=true"
    ]
    healthcheck:
      test: "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"
      interval: 5s
      timeout: 2s
      retries: 15

