# This file documents the OpenLineage ingest endpoint exposed by Apache Polaris.
#
# IMPORTANT: This spec is documentation, not a code-generation source. The
# OpenLineage event schema is a `oneOf` over RunEvent / JobEvent / DatasetEvent
# discriminated by the `schemaURL` field, which the OpenAPI Generator's Java
# templates cannot translate faithfully (they collapse the variants into a
# single class with every variant's required fields marked `@NotNull`,
# rejecting every valid event with a 400). Polaris instead hand-writes the
# JAX-RS resource on top of the official `io.openlineage:openlineage-java`
# library, exactly as Marquez (the OpenLineage reference server) does. See
# `api/openlineage-service/` for the implementation.
#
# The authoritative event schema lives upstream:
#   https://openlineage.io/spec/2-0-2/OpenLineage.json
#
# This file is kept so the OpenLineage endpoint shows up alongside Polaris's
# other API specs and can be browsed by API tools.

---
openapi: 3.0.3
info:
  title: Apache Polaris OpenLineage Service
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 0.0.1
  description:
    Defines the OpenLineage-compatible ingest API exposed by Apache Polaris.
    Polaris accepts OpenLineage events under the /api/openlineage/v1 path so
    engines (Spark, Flink, Airflow, Trino, dbt) can be reconfigured by URL
    alone. Event bodies follow the OpenLineage specification at
    https://openlineage.io/spec/2-0-2/OpenLineage.json.

servers:
  - url: "{scheme}://{host}/api/openlineage/v1"
    description: Server URL when the port can be inferred from the scheme
    variables:
      scheme:
        description: The scheme of the URI, either http or https.
        default: https
      host:
        description: The host address for the specified server
        default: localhost

# OpenLineage ingest uses the same authentication as every other Polaris REST
# API: OAuth2 client-credentials against the Polaris token endpoint, or a Bearer
# JWT. These are the same schemes declared by the catalog and management specs.
security:
  - OAuth2: []
  - BearerAuth: []

paths:
  /lineage:
    post:
      tags:
        - OpenLineage API
      summary: Submit an OpenLineage event
      description:
        Accepts an OpenLineage RunEvent, JobEvent, or DatasetEvent as defined
        by the OpenLineage specification
        (https://openlineage.io/spec/2-0-2/OpenLineage.json).


        The body is dispatched to the correct event variant by inspecting the
        `schemaURL` field — the fragment after the final `/` selects RunEvent,
        JobEvent, or DatasetEvent. Unrecognized values fall back to RunEvent.


        This endpoint is the standard OpenLineage ingest path, so existing
        OpenLineage transports can target Polaris by URL change alone.
      operationId: sendLineageEvent
      requestBody:
        description:
          An OpenLineage event. The exact body schema is the upstream
          OpenLineage 2-0-2 JSON Schema referenced above.
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              externalDocs:
                description: OpenLineage 2-0-2 JSON Schema (authoritative)
                url: https://openlineage.io/spec/2-0-2/OpenLineage.json
      responses:
        201:
          description:
            Created. The event was accepted for processing. Per the
            OpenLineage server specification the response body is empty.
        400:
          description: Bad Request - The request body is not a valid OpenLineage event
        401:
          description: Unauthorized - The caller is not authenticated
        403:
          description: Forbidden - The caller is not authorized to submit lineage events
        503:
          description: Service Unavailable - The lineage subsystem is temporarily unable to accept events
        5XX:
          description: Server error

  /lineage/batch:
    post:
      tags:
        - OpenLineage API
      summary: Submit a batch of OpenLineage events
      description:
        Accepts a JSON array of OpenLineage RunEvent, JobEvent, or DatasetEvent
        objects as defined by the OpenLineage batch API
        (https://openlineage.io/apidocs/openapi/).


        Each event is dispatched to the correct variant by inspecting its
        `schemaURL` field, exactly as the single-event endpoint does. Events are
        processed independently; the response summarizes how many were accepted
        and lists any that failed along with whether the failure is retriable.
      operationId: sendLineageEventBatch
      requestBody:
        description:
          A JSON array of OpenLineage events. Each element follows the upstream
          OpenLineage 2-0-2 JSON Schema referenced above.
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                additionalProperties: true
              externalDocs:
                description: OpenLineage 2-0-2 JSON Schema (authoritative)
                url: https://openlineage.io/spec/2-0-2/OpenLineage.json
      responses:
        200:
          description:
            OK. The batch was processed. The body summarizes the
            received/successful/failed counts and lists any failed events.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [SUCCESS, PARTIAL, FAILURE]
                  summary:
                    type: object
                    properties:
                      received:
                        type: integer
                      successful:
                        type: integer
                      failed:
                        type: integer
                  failed_events:
                    type: array
                    items:
                      type: object
                      properties:
                        index:
                          type: integer
                        retriable:
                          type: boolean
                        message:
                          type: string
        400:
          description: Bad Request - The request body is not a valid array of OpenLineage events
        401:
          description: Unauthorized - The caller is not authenticated
        403:
          description: Forbidden - The caller is not authorized to submit lineage events
        503:
          description: Service Unavailable - The lineage subsystem is temporarily unable to accept events
        5XX:
          description: Server error

components:
  securitySchemes:
    # This scheme mirrors the OAuth2 definition in iceberg-rest-catalog-open-api.yaml
    # and polaris-catalog-service.yaml so that the OpenLineage ingest API accepts the
    # same credentials as the rest of Polaris. The same client-id/secret used for
    # catalog access is used here.
    #
    # TODO: a dedicated LINEAGE_INGEST privilege grant will be required once privilege
    # enforcement is implemented; the endpoint currently uses @RolesAllowed("**").
    OAuth2:
      type: oauth2
      description:
        This scheme is used for OAuth2 authorization.


        For unauthorized requests, services should return an appropriate 401 or
        403 response. Implementations must not return altered success (200)
        responses when a request is unauthenticated or unauthorized.


        If a separate authorization server is used, substitute the tokenUrl with
        the full token path of the external authorization server, and use the
        resulting token to access the resources defined in the spec.
      flows:
        clientCredentials:
          tokenUrl: /v1/oauth/tokens
          # No scope is required: ingest is authorized per-realm by the Polaris auth
          # filter (@RolesAllowed), not by OAuth2 scope. Any valid Polaris token works,
          # the same as it does for the other Polaris REST APIs.
          scopes: {}
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
