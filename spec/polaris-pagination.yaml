# Pagination definitions shared by the Polaris-specific APIs. A list operation references the two
# parameters and uses the PageToken schema for the token in its response.
#
# These rules differ from the Iceberg REST Catalog API, where a server must return all results when
# the request has no `pageToken`. Operations defined by the Iceberg REST Catalog API keep its rules.

---
components:
  parameters:
    PolarisPageToken:
      name: pageToken
      in: query
      required: false
      description: >
        The page token from the previous response of the same list operation, sent unchanged. Omit
        it, or send it empty, to get the first page. With a page token, the client sends the same
        path and query parameters as in the previous request, except `pageSize`, which it may
        change. The server returns `400 Bad Request` for a page token it cannot use, and may do so
        when the other parameters differ from the previous request.
      schema:
        type: string

    PolarisPageSize:
      name: pageSize
      in: query
      required: false
      description: >
        The largest number of results the client wants in one page. A server that paginates returns
        at most this many results in a page. It may return fewer, even none, in a page that is not
        the last; a client that gets a page with no results and a page token requests the next page
        with that token. Without `pageSize`, the server chooses the page size.
      schema:
        type: integer
        minimum: 1

  schemas:
    PolarisPageToken:
      description: |
        An opaque token that continues a list operation. Clients must not interpret it.

        - Any response of an operation that uses these definitions may be paginated. A client must
          always check for a page token in the response and, when one is present, send it unchanged
          as the `pageToken` query parameter to get the next page. The server omits the page token
          from the last page. A client must treat a missing, `null`, or empty page token as the end
          of the results.
        - A client does not need to send `pageToken` or `pageSize` to start paginating. The server
          may paginate a response to a request that has neither.
        - A server that does not paginate returns all results in one response, with no page token.
      type: string
