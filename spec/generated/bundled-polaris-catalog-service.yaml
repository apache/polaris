        partition-statistics:
          type: array
          items:
            $ref: '#/components/schemas/PartitionStatisticsFile'
    StorageCredential:
      type: object
      required:
        - prefix
        - config
      properties:
        prefix:
          type: string
          description: Indicates a storage location prefix where the credential is relevant. Clients should choose the most specific prefix (by selecting the longest prefix) if several credentials of the same type are available.
        config:
          type: object
          additionalProperties:
            type: string
    MultiValuedMap:
      description: A map of string keys where each key can map to multiple string values.
      type: object
      additionalProperties:
        type: array
        items:
          type: string
    RemoteSigningConfig:
      description: Configuration for the remote signer client.
      type: object
      properties:
        properties:
          type: object
          additionalProperties:
            type: string
          description: |
            Static key-value pairs the signer client MUST pass through unchanged in the `properties` field of every `RemoteSignRequest` sent to the signing endpoint.
        headers:
          allOf:
            - $ref: '#/components/schemas/MultiValuedMap'
          description: |
            Static headers the signer client MUST include unchanged in every request to the signing endpoint.
    Action:
      discriminator:
        propertyName: action
        mapping:
          mask-alphanum: '#/components/schemas/MaskAlphanum'
          mask-to-fixed-value: '#/components/schemas/MaskToFixedValue'
          replace-with-null: '#/components/schemas/ReplaceWithNull'
          show-first-4: '#/components/schemas/ShowFirst4'
          show-last-4: '#/components/schemas/ShowLast4'
          truncate-to-year: '#/components/schemas/TruncateToYear'
          truncate-to-month: '#/components/schemas/TruncateToMonth'
          sha-256-global: '#/components/schemas/Sha256Global'
          sha-256-query-local: '#/components/schemas/Sha256QueryLocal'
      type: object
      required:
        - action
        - field-id
      properties:
        action:
          type: string
        field-id:
          type: integer
          description: Field ID of the column being projected.
    MaskAlphanum:
      description: |
        Redacts the column value using the following rules to transform Unicode code points:
        - Digits (U+0030–U+0039, 0-9) are replaced with 'n' - The following punctuation characters are kept as-is:
            U+0028 '('  LEFT PARENTHESIS
            U+0029 ')'  RIGHT PARENTHESIS
            U+002C ','  COMMA
            U+002E '.'  FULL STOP
            U+002D '-'  HYPHEN-MINUS
            U+0040 '@'  COMMERCIAL AT
        - All other Unicode characters (including letters, whitespace, and any punctuation
          not listed above) are replaced with 'x'

        For example: "iceberg16112018@apache.org" -> "xxxxxxxnnnnnnnn@xxxxxx.xxx"
        NULL input is preserved (NULL -> NULL).
        Applicable to: string
      allOf:
        - $ref: '#/components/schemas/Action'
      properties:
        action:
          type: string
          const: mask-alphanum
    MaskToFixedValue:
      description: |
        Replaces the column value with a type-specific fixed value. Readers must use exactly the values listed below to ensure consistency across implementations.
        Fixed values by type: - boolean: false - int: 0 - long: 0 - float: 0.0 - double: 0.0 - decimal(p, s): 0 (the unscaled value is 0) - string: "XXXXXXXX" - date: 1970-01-01 - time: 00:00:00 - timestamp: 1970-01-01T00:00:00 - timestamptz: 1970-01-01T00:00:00+00:00 - timestamp_ns: 1970-01-01T00:00:00.000000000 - timestamptz_ns: 1970-01-01T00:00:00.000000000+00:00 - uuid: 00000000-0000-0000-0000-000000000000 - fixed(n): n zero bytes - binary: empty byte sequence - variant: an empty variant object - list: empty list [] - map: empty map {} - struct: struct with each field set to its type-specific default (applied recursively)
        NULL input is also replaced with the type-specific fixed value; NULL is not preserved.
        Applicable to: the types with a fixed value defined above. A server must not return mask-to-fixed-value for any other type.
      allOf:
        - $ref: '#/components/schemas/Action'
      properties:
        action:
          type: string
          const: mask-to-fixed-value
    ReplaceWithNull:
      description: |
        Replaces the column value with NULL. NULL input is preserved (NULL -> NULL).
        Applicable to: all optional types. A server must not return replace-with-null for a required (non-nullable) field; a reader that receives one must fail the query.
      allOf:
        - $ref: '#/components/schemas/Action'
      properties:
        action:
          type: string
          const: replace-with-null
    ShowFirst4:
      description: |
        Preserves the first 4 Unicode code points of the column value and redacts the remainder using mask-alphanum rules (see MaskAlphanum for the exact character rules). Values with 4 or fewer Unicode code points are returned unchanged.
        For example: "iceberg16112018@apache.org" -> "icebxxxnnnnnnnn@xxxxxx.xxx"
        NULL input is preserved (NULL -> NULL).
        Applicable to: string
      allOf:
        - $ref: '#/components/schemas/Action'
      properties:
        action:
          type: string
          const: show-first-4
    ShowLast4:
      description: |
        Redacts all Unicode code points except the last 4 using mask-alphanum rules (see MaskAlphanum for the exact character rules). Values with 4 or fewer Unicode code points are returned unchanged.
        For example: "4111-1111-1111-4444" -> "nnnn-nnnn-nnnn-4444"
        NULL input is preserved (NULL -> NULL).
        Applicable to: string
      allOf:
        - $ref: '#/components/schemas/Action'
      properties:
        action:
          type: string
          const: show-last-4
    TruncateToYear:
      description: |
        Truncates the column value to year precision, setting month, day, and time components to their minimum values. The output type matches the input type.
        For example: 2024-07-15 -> 2024-01-01 For timestamptz and timestamptz_ns, truncation is performed in UTC.
        NULL input is preserved (NULL -> NULL).
        Applicable to: date, timestamp, timestamptz, timestamp_ns, timestamptz_ns
      allOf:
        - $ref: '#/components/schemas/Action'
      properties:
        action:
          type: string
          const: truncate-to-year
    TruncateToMonth:
      description: |
        Truncates the column value to year and month precision, setting day and time components to their minimum values. The output type matches the input type.
        For example: 2024-07-15 -> 2024-07-01 For timestamptz and timestamptz_ns, truncation is performed in UTC.
        NULL input is preserved (NULL -> NULL).
        Applicable to: date, timestamp, timestamptz, timestamp_ns, timestamptz_ns
      allOf:
        - $ref: '#/components/schemas/Action'
      properties:
        action:
          type: string
          const: truncate-to-month
    Sha256Global:
      description: |
        Applies SHA-256. Deterministic across all queries
        and readers: the same input always produces the same output.

        Input-to-bytes encoding by type:
        - string: UTF-8 encoded bytes
        - int: 4 bytes, little-endian
        - long: 8 bytes, little-endian
        - binary: raw bytes as-is

        Output encoding by type:
        - string: 64-character lowercase hexadecimal string
        - int: first 4 bytes of the digest, read as a little-endian int
        - long: first 8 bytes of the digest, read as a little-endian long
        - binary: the full 32-byte raw SHA-256 digest

        NULL input is preserved (NULL -> NULL).

        Applicable to: string, int, long, binary
      allOf:
        - $ref: '#/components/schemas/Action'
      properties:
        action:
          type: string
          const: sha-256-global
    Sha256QueryLocal:
      description: |
        Applies SHA-256 with a per-query random salt, making the output non-deterministic
        across queries while remaining consistent within a single query. The definition
        of a query is left to the implementation.

        The reader must generate a cryptographically random salt of at least 16 bytes for each query.

        For each column value, the reader must encode the value to bytes using
        sha-256-global's input rules, prepend the per-query salt, and compute
        SHA-256 over the result.

        Output encoding follows the same rules as sha-256-global.

        NULL input is preserved (NULL -> NULL).

        Applicable to: string, int, long, binary
      allOf:
        - $ref: '#/components/schemas/Action'
      properties:
        action:
          type: string
          const: sha-256-query-local
    ExpressionType:
      type: string
      example:
        - 'true'
        - 'false'
        - eq
        - and
        - or
        - not
        - in
        - not-in
        - lt
        - lt-eq
        - gt
        - gt-eq
        - not-eq
        - starts-with
        - not-starts-with
        - is-null
        - not-null
        - is-nan
        - not-nan
    TrueExpression:
      deprecated: true
      description: |
        Deprecated. Use the bare boolean literal `true` as a predicate instead.
      type: object
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/ExpressionType'
          const: 'true'
    FalseExpression:
      deprecated: true
      description: |
        Deprecated. Use the bare boolean literal `false` as a predicate instead.
      type: object
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/ExpressionType'
          const: 'false'
    Predicate:
      oneOf:
        - type: boolean
        - $ref: '#/components/schemas/TrueExpression'
        - $ref: '#/components/schemas/FalseExpression'
        - $ref: '#/components/schemas/AndOrPredicate'
        - $ref: '#/components/schemas/NotPredicate'
        - $ref: '#/components/schemas/UnaryPredicate'
        - $ref: '#/components/schemas/ComparisonPredicate'
        - $ref: '#/components/schemas/SetPredicate'
    AndOrPredicate:
      type: object
      required:
        - type
        - left
        - right
      properties:
        type:
          $ref: '#/components/schemas/ExpressionType'
          enum:
            - and
            - or
        left:
          $ref: '#/components/schemas/Predicate'
        right:
          $ref: '#/components/schemas/Predicate'
    NotPredicate:
      type: object
      required:
        - type
        - child
      properties:
        type:
          $ref: '#/components/schemas/ExpressionType'
          const: not
        child:
          $ref: '#/components/schemas/Predicate'
    Literal:
      description: |
        A literal is either a bare value, an untyped literal object, or a typed literal object.
      oneOf:
        - $ref: '#/components/schemas/PrimitiveTypeValue'
        - type: object
          additionalProperties: false
          required:
            - type
            - value
          properties:
            type:
              type: string
              const: literal
            value:
              $ref: '#/components/schemas/PrimitiveTypeValue'
            data-type:
              $ref: '#/components/schemas/PrimitiveType'
    IdReference:
      description: A bound reference to a field by field ID.
      type: object
      additionalProperties: false
      required:
        - type
        - id
      properties:
        type:
          type: string
          const: reference
        id:
          type: integer
    NamedReference:
      description: An unbound reference to a field by name.
      type: object
      additionalProperties: false
      required:
        - type
        - name
      properties:
        type:
          type: string
          const: reference
        name:
          type: string
    Reference:
      description: |
        A reference to a field. Either a bound reference (by field ID) or an unbound reference (by name). The context in which an expression is used determines which form is valid.
      oneOf:
        - $ref: '#/components/schemas/IdReference'
        - $ref: '#/components/schemas/NamedReference'
    CatalogObjectIdentifier:
      description: Reference to a catalog object (for example, table, view, or namespace) as an ordered list of hierarchical levels. The object kind is determined by context (e.g. the endpoint or a companion type discriminator), not by the identifier structure alone.
      type: array
      items:
        type: string
      example:
        - accounting
        - tax
        - paid
    ValueExpression:
      description: |
        A value expression: a literal, a field reference, or a function application.
      oneOf:
        - $ref: '#/components/schemas/Literal'
        - $ref: '#/components/schemas/Reference'
        - $ref: '#/components/schemas/Apply'
    FunctionArgument:
      anyOf:
        - $ref: '#/components/schemas/ValueExpression'
        - $ref: '#/components/schemas/Predicate'
    Apply:
      description: |
        A function application on zero or more value expressions or predicates.
      type: object
      additionalProperties: false
      required:
        - type
        - function
        - arguments
      properties:
        type:
          type: string
          const: apply
        function:
          oneOf:
            - type: string
              minLength: 1
            - $ref: '#/components/schemas/CatalogObjectIdentifier'
            - type: object
              additionalProperties: false
              required:
                - identifier
              properties:
                catalog:
                  type: string
                identifier:
                  $ref: '#/components/schemas/CatalogObjectIdentifier'
        arguments:
          type: array
          items:
            $ref: '#/components/schemas/FunctionArgument'
    TermReference:
      deprecated: true
      description: |
        Deprecated string-form field reference used in older REST predicates. Use Reference (IdReference or NamedReference) instead.
      type: string
      example:
        - column-name
    TransformTerm:
      deprecated: true
      description: |
        Deprecated. Legacy transform-applied-to-a-term form. Use Apply with a Reference argument instead.
      type: object
      required:
        - type
        - transform
        - term
      properties:
        type:
          type: string
          const: transform
        transform:
          $ref: '#/components/schemas/Transform'
        term:
          $ref: '#/components/schemas/TermReference'
    Term:
      deprecated: true
      description: |
        Deprecated. Legacy term form used by older REST predicates. Use Reference or Apply instead.
      oneOf:
        - $ref: '#/components/schemas/TermReference'
        - $ref: '#/components/schemas/TransformTerm'
    UnaryPredicate:
      description: |
        A predicate that tests a single value expression. Accepts either 'child' (preferred) or 'term' (deprecated) to identify the operand.
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/ExpressionType'
          enum:
            - is-null
            - not-null
            - is-nan
            - not-nan
        child:
          $ref: '#/components/schemas/ValueExpression'
        term:
          deprecated: true
          description: Deprecated. Use 'child' instead.
          $ref: '#/components/schemas/Term'
    ComparisonPredicate:
      description: |
        A predicate that compares two value expressions. Accepts either 'left'/'right' (preferred) or 'term'/'value' (deprecated).
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/ExpressionType'
          enum:
            - lt
            - lt-eq
            - gt
            - gt-eq
            - eq
            - not-eq
            - starts-with
            - not-starts-with
        left:
          $ref: '#/components/schemas/ValueExpression'
        right:
          $ref: '#/components/schemas/ValueExpression'
        term:
          deprecated: true
          description: Deprecated. Use 'left' instead.
          $ref: '#/components/schemas/Term'
        value:
          deprecated: true
          description: Deprecated. Use 'right' instead.
          $ref: '#/components/schemas/Literal'
    Literals:
      description: |
        Literals is either a bare array of literals or a typed object with an explicit data-type applied to all values.
      oneOf:
        - type: array
          items:
            $ref: '#/components/schemas/Literal'
        - type: object
          additionalProperties: false
          required:
            - type
            - values
            - data-type
          properties:
            type:
              type: string
              const: literals
            values:
              type: array
              items:
                $ref: '#/components/schemas/PrimitiveTypeValue'
            data-type:
              $ref: '#/components/schemas/PrimitiveType'
    SetPredicate:
      description: |
        A predicate that tests whether a value is in a set of literals. Accepts either 'child' (preferred) or 'term' (deprecated) to identify the operand.
      type: object
      additionalProperties: false
      required:
        - type
        - values
      properties:
        type:
          $ref: '#/components/schemas/ExpressionType'
          enum:
            - in
            - not-in
        child:
          $ref: '#/components/schemas/ValueExpression'
        term:
          deprecated: true
          description: Deprecated. Use 'child' instead.
          $ref: '#/components/schemas/Term'
        values:
          $ref: '#/components/schemas/Literals'
    ReadRestrictions:
      type: object
      description: |
        Read restrictions for a table.
        A reader evaluates the row filter against original, untransformed column values, then applies required-column-projections to the surviving rows. Each action must produce a value of the same type as the input column. If a reader that supports read-restrictions cannot apply any returned restriction (a filter expression or an action), it must fail the query and must not silently return raw, partial, or empty results.
        A missing or empty ReadRestrictions object (no required-column-projections and no required-row-filter) imposes no restrictions.
      example:
        required-column-projections:
          - field-id: 4
            action: show-last-4
          - field-id: 6
            action: replace-with-null
          - field-id: 8
            action: truncate-to-year
          - field-id: 10
            action: sha-256-global
          - field-id: 12
            action: mask-alphanum
        required-row-filter:
          type: eq
          left:
            type: reference
            id: 14
          right:
            type: literal
            value: US
      properties:
        required-column-projections:
          description: |
            A list of columns that require specific actions to be applied when reading. A server must not return an action for a column whose type is not listed in that action's "Applicable to" set. If absent or empty, no required actions apply; columns not listed are not subject to any required action.
            1. For each column listed, the reader must apply the specified action before
              returning values for that column.

            2. The reader must replace all output references to the column with the result
              of the action, presenting the result under the original field-id. For
              example, if the action for field-id `9` is mask-alphanum, the reader must
              return the masked value as field-id `9` in the query output.

            3. A server must not return more than one projection for the same field-id
              in required-column-projections. If a duplicate field-id appears, the reader
              must fail the query.

            4. A server must not return a projection that targets a map's key field-id;
              a reader that receives one must fail the query. Applying an action to keys
              can produce duplicate or null keys, which readers silently coalesce or
              reject, causing data loss.

            5. A reader must enforce projections on the columns it is actually reading.
              Projections referencing columns that are not being read do not apply.

            6. A server must not return projections on both a nested-typed field
              (struct, list, or map) and any field-id nested within it at any depth.
              A reader that receives such a response must fail the query.
          type: array
          items:
            $ref: '#/components/schemas/Action'
        required-row-filter:
          description: |
            An expression that limits which rows the reader may return.
            1. The expression must evaluate to a boolean (TRUE or FALSE; Iceberg predicates
              never produce NULL). A reader must discard any row for which the filter
              evaluates to FALSE, and no information derived from discarded rows may be
              included in the query result.

            2. If this property is absent, null, or always true then no mandatory filtering is required.
            3. Column references within the expression must use field IDs (IdReference),
              not column names. This ensures the filter remains valid across column renames,
              consistent with required-column-projections which also reference columns by field-id.
          allOf:
            - $ref: '#/components/schemas/Predicate'
    CatalogObjectLabels:
      type: object
      description: Flat key-value labels attached to the object (table, view, ...) as a whole.
      additionalProperties:
        type: string
    FieldLabels:
      type: object
      description: Labels attached to a single field, identified by field-id.
      required:
        - field-id
        - labels
      properties:
        field-id:
          type: integer
          description: Field ID from the schema of the table or view
        labels:
          type: object
          description: Flat key-value labels for this field
          additionalProperties:
            type: string
    Labels:
      type: object
      description: |
        Catalog-provided metadata enrichment (for example ownership,
        classification, or cost attribution) returned with a table or view.
        Labels are catalog-provided and optional; clients may ignore them, and
        may cache them following the response ETag.
        The spec does not require how a catalog produces or stores labels, nor
        whether they are persisted or versioned. `object-labels` carries
        labels for the object as a whole; `fields` carries per-field labels,
        each identified by field-id.
      properties:
        object-labels:
          $ref: '#/components/schemas/CatalogObjectLabels'
        fields:
          type: array
          description: Field-level labels. Each entry identifies its field by field-id.
          items:
            $ref: '#/components/schemas/FieldLabels'
    LoadTableResult:
      description: |
        Result used when a table is successfully loaded.


        The table metadata JSON is returned in the `metadata` field. The corresponding file location of table metadata should be returned in the `metadata-location` field, unless the metadata is not yet committed. For example, a create transaction may return metadata that is staged but not committed.
        Clients can check whether metadata has changed by comparing metadata locations after the table has been created.


        The `config` map returns table-specific configuration for the table's resources, including its HTTP client and FileIO. For example, config may contain a specific FileIO implementation class for the table depending on its underlying storage.


        The following configurations should be respected by clients:

        ## General Configurations

        - `token`: Authorization bearer token to use for table requests if OAuth2 security is enabled
        - `scan-planning-mode`: Communicates to clients the supported planning mode. Clients should use this value to fail fast if the supported scanning mode is not available on the client. Valid values:
          - `client`: Clients MUST use client-side scan planning
          - `server`: Clients MUST use server-side scan planning via the `planTableScan` endpoint

        ## AWS Configurations

        The following configurations should be respected when working with tables stored in AWS S3
         - `client.region`: region to configure client for making requests to AWS
         - `s3.access-key-id`: id for credentials that provide access to the data in S3
         - `s3.secret-access-key`: secret for credentials that provide access to data in S3
         - `s3.session-token`: if present, this value should be used for as the session token
         - `s3.remote-signing-enabled`: if `true` remote signing should be performed as described in the `RemoteSignRequest` schema section of this spec document.
         - `s3.cross-region-access-enabled`: if `true`, S3 Cross-Region bucket access is enabled

        ## Storage Credentials

        Credentials for ADLS / GCS / S3 / ... are provided through the `storage-credentials` field.
        Clients must first check whether the respective credentials exist in the `storage-credentials` field before checking the `config` for credentials.

        ## Remote Signing

        If remote signing for a specific storage provider is enabled, the server SHOULD use the `remote-signing-config`
        field to communicate all signer client settings. When the `remote-signing-config` field is present, clients
        SHOULD respect the provided configuration.

        For backward compatibility, the following `config` properties are still supported but **DEPRECATED** and SHOULD NOT be used by clients able to consume the remote signing configuration:
         - `signer.endpoint` **DEPRECATED**.: the remote signer endpoint. Can either be a relative path (to be resolved against `signer.uri`) or an absolute URI.
         - `signer.uri` **DEPRECATED**.: the base URI to resolve `signer.endpoint` against. Only meaningful if `signer.endpoint` is a relative path. Defaults to the catalog's base URI if not set.
        If any of these properties is present, clients SHOULD use them to compute the actual remote signing endpoint URI to contact.
        If none of these properties is present, clients SHOULD contact the default remote signing endpoint using the catalog's base URI.
      type: object
      required:
        - metadata
      properties:
        metadata-location:
          type:
            - string
            - 'null'
          description: May be null if the table is staged as part of a transaction
        metadata:
          $ref: '#/components/schemas/TableMetadata'
        config:
          type: object
          additionalProperties:
            type: string
        storage-credentials:
          type: array
          items:
            $ref: '#/components/schemas/StorageCredential'
        remote-signing-config:
          $ref: '#/components/schemas/RemoteSigningConfig'
        read-restrictions:
          $ref: '#/components/schemas/ReadRestrictions'
        labels:
          $ref: '#/components/schemas/Labels'
