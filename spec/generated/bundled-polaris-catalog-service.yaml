          schema:
            $ref: '#/components/schemas/GetApplicablePoliciesResponse'
    ListSemanticModelsResponse:
      description: A list of semantic model identifiers
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ListSemanticModelsResponse'
          examples:
            ListSemanticModelsResponseNonEmpty:
              $ref: '#/components/examples/ListSemanticModelsNonEmptyExample'
            ListSemanticModelsResponseEmpty:
              $ref: '#/components/examples/ListSemanticModelsEmptyExample'
    CreateSemanticModelResponse:
      description: Semantic model object result after creating a semantic model
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoadSemanticModelResponse'
    LoadSemanticModelResponse:
      description: Semantic model object result when loading a semantic model
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoadSemanticModelResponse'
    UpdateSemanticModelResponse:
      description: |
        Response when a semantic model is successfully updated.

        The updated Apache Ossie document is returned in the `document` field.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoadSemanticModelResponse'
    ListTagsResponse:
      description: |
        One page of tag definition identifiers, or the complete list for a full-result request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ListTagsResponse'
          examples:
            ListTagsResponseNonEmpty:
              $ref: '#/components/examples/ListTagsNonEmptyExample'
            ListTagsResponseEmpty:
              $ref: '#/components/examples/ListTagsEmptyExample'
    TagUnauthorizedResponse:
      description: |
        Unauthorized - the request carries no credentials, or credentials the server cannot
        authenticate.

        Possible error types: Unauthorized.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PolarisErrorResponse'
          example:
            error:
              message: Not authorized
              type: Unauthorized
              code: 401
    TagForbiddenResponse:
      description: |
        Forbidden - the caller is authenticated but lacks the permission this operation requires.

        Possible error types: Forbidden.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PolarisErrorResponse'
          example:
            error:
              message: Not authorized to perform this operation
              type: Forbidden
              code: 403
    TagServiceUnavailableResponse:
      description: |
        The server cannot handle the request now; the caller may retry.

        For createTag, updateTag, and renameTag, exhausted idempotency recognition capacity also
        returns this response with Retry-After. The write is not applied and existing recognition is
        preserved.

        Possible error types: ServiceUnavailable.
      headers:
        Retry-After:
          description: |
            How long to wait before retrying, as seconds or an HTTP-date. Present when the server
            can state a delay, and always for exhausted idempotency recognition capacity.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PolarisErrorResponse'
          example:
            error:
              message: Service is unavailable, please retry
              type: ServiceUnavailable
              code: 503
    TagServerErrorResponse:
      description: |
        An unexpected server failure or a required dependency failure not covered by another
        response. The response uses type InternalServerError and code 500.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PolarisErrorResponse'
          example:
            error:
              message: Internal Server Error
              type: InternalServerError
              code: 500
    CreateTagResponse:
      description: The created definition, returned directly
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Tag'
    LoadTagResponse:
      description: The definition, returned directly
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Tag'
    TagBadRequestResponse:
      description: |
        ValidationError covers a missing required value or a schema-type violation. BadRequest
        covers other invalid input. Operation-specific error classifications take precedence.

        Possible error types: ValidationError, BadRequest.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PolarisErrorResponse'
          examples:
