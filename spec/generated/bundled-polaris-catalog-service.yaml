        location:
          type: string
        current-version-id:
          type: integer
        versions:
          type: array
          items:
            $ref: '#/components/schemas/ViewVersion'
        version-log:
          type: array
          items:
            $ref: '#/components/schemas/ViewHistoryEntry'
        schemas:
          type: array
          items:
            $ref: '#/components/schemas/Schema'
        properties:
          type: object
          additionalProperties:
            type: string
    LoadViewResult:
      description: |
        Result used when a view is successfully loaded.


        The view metadata JSON is returned in the `metadata` field. The corresponding file location of view metadata is returned in the `metadata-location` field.
        Clients can check whether metadata has changed by comparing metadata locations after the view has been created.

        The `config` map returns view-specific configuration for the view's resources.

        The following configurations should be respected by clients:

        ## General Configurations

        - `token`: Authorization bearer token to use for view requests if OAuth2 security is enabled
      type: object
      required:
        - metadata-location
        - metadata
      properties:
        metadata-location:
          type: string
        metadata:
          $ref: '#/components/schemas/ViewMetadata'
        config:
          type: object
          additionalProperties:
            type: string
        labels:
          $ref: '#/components/schemas/Labels'
    RegisterViewRequest:
      type: object
      required:
        - name
        - metadata-location
      properties:
        name:
          type: string
        metadata-location:
          type: string
    AssertViewUUID:
      description: The view UUID must match the requirement's `uuid`
      required:
        - type
        - uuid
      properties:
        type:
          type: string
          const: assert-view-uuid
        uuid:
          type: string
    ViewRequirement:
      type: object
      discriminator:
        propertyName: type
        mapping:
          assert-view-uuid: '#/components/schemas/AssertViewUUID'
      oneOf:
        - $ref: '#/components/schemas/AssertViewUUID'
    ViewUpdate:
      anyOf:
        - $ref: '#/components/schemas/AssignUUIDUpdate'
        - $ref: '#/components/schemas/UpgradeFormatVersionUpdate'
        - $ref: '#/components/schemas/AddSchemaUpdate'
        - $ref: '#/components/schemas/SetLocationUpdate'
        - $ref: '#/components/schemas/SetPropertiesUpdate'
        - $ref: '#/components/schemas/RemovePropertiesUpdate'
        - $ref: '#/components/schemas/AddViewVersionUpdate'
        - $ref: '#/components/schemas/SetCurrentViewVersionUpdate'
    CommitViewRequest:
      type: object
      required:
        - updates
      properties:
        identifier:
          description: View identifier to update
          $ref: '#/components/schemas/TableIdentifier'
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/ViewRequirement'
        updates:
          type: array
          items:
            $ref: '#/components/schemas/ViewUpdate'
    NotificationType:
      type: string
      enum:
        - UNKNOWN
        - CREATE
        - UPDATE
        - DROP
        - VALIDATE
    TableUpdateNotification:
      type: object
      required:
        - table-name
        - timestamp
        - table-uuid
        - metadata-location
      properties:
        table-name:
          type: string
        timestamp:
          type: integer
          format: int64
        table-uuid:
          type: string
        metadata-location:
          type: string
        metadata:
          $ref: '#/components/schemas/TableMetadata'
    NotificationRequest:
      required:
        - notification-type
        - payload
      properties:
        notification-type:
          $ref: '#/components/schemas/NotificationType'
        payload:
          $ref: '#/components/schemas/TableUpdateNotification'
    ListGenericTablesResponse:
      type: object
      properties:
        next-page-token:
          $ref: '#/components/schemas/PageToken'
        identifiers:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/TableIdentifier'
    CreateGenericTableRequest:
      type: object
      required:
        - name
        - format
      properties:
        name:
          type: string
        format:
          type: string
        base-location:
          type: string
        doc:
          type: string
        properties:
          type: object
          additionalProperties:
            type: string
    GenericTable:
      type: object
      description: |
        Generic Table information.
        - `name` (REQUIRED): name for the generic table
        - `format` (REQUIRED): format for the generic table, i.e. "delta", "csv"
        - `base-location` (OPTIONAL): table base location in URI format. For example: s3://<my-bucket>/path/to/table.
          - The table base location is a location that includes all files for the table.
          - A table with multiple disjoint locations (i.e. containing files that are outside the configured base location) is not compliant with the current generic table support in Polaris.
          - If no location is provided, clients or users are responsible for managing the location.

        - `properties` (OPTIONAL): properties for the generic table passed on creation
        - `doc` (OPTIONAL): comment or description for the generic table
      required:
        - name
        - format
      properties:
        name:
          type: string
        format:
          type: string
        base-location:
          type: string
        doc:
          type: string
        properties:
          type: object
          additionalProperties:
            type: string
    StorageAccessConfig:
      type: object
      required:
        - prefix
        - config
      properties:
        prefix:
          type: string
          description: Indicates a storage location prefix where the configuration is relevant. Clients should choose the most specific prefix (by selecting the longest common prefix) if several configurations of the same type are available. If multiple configurations share the same longest matching prefix, the client may select any of them. However, a server should avoid generating multiple configurations for the same prefix.
        config:
          type: object
          description: |
            Storage access configurations for S3, GCP GCS, and Azure ADLS are supported. The following outlines 
            the currently supported configuration options:
              
            ## S3 Configurations
              
            The following configurations should be respected when working with tables stored on S3, including AWS S3, S3-Compatible systems:
              - `s3.access-key-id`: id for credentials that provide access to the data in S3
              - `s3.secret-access-key`: secret for credentials that provide access to data in S3
              - `s3.session-token`: if present, this value should be used for as the session token
              - `s3.session-token-expires-at-ms`: the time the aws session token expires, in milliseconds
              - `s3.client.region`: region to configure client for making requests to S3
              - `s3.client.refresh-credentials-endpoint`: the endpoint to load vended credentials for a table from the catalog
              
            ## GCP GCS Configurations

            The following configurations should be respected when working with tables stored in GCP GCS:
              - `gcs.oauth2.token`: the gcs scoped access token
              - `gcs.oauth2.token-expires-at`: the time the gcs access token expires, in milliseconds
              - `gcs.oauth2.refresh-credentials-endpoint`: the endpoint to load vended credentials for a table from the catalog

            ## AZURE ADLS Configuration

            The following configurations should be respected when working with tables stored in AZURE ADLS:
              - `adls.sas-token.<hostname>`: an azure shared access signature token
              - `adls.sas-token-expires-at-ms.<hostname>`: the expiration time for the access token, in milliseconds
              - `adls.refresh-credentials-endpoint`: the endpoint to load vended credentials for a table from the catalog
          additionalProperties:
            type: string
    LoadGenericTableResponse:
      description: Result used when a table is successfully loaded.
      type: object
      required:
        - table
      properties:
        table:
          $ref: '#/components/schemas/GenericTable'
        storage-access-configs:
          type: array
          description: |
            Storage configurations required to access the table, encompassing both credentials and other necessary 
            settings for storage access, such as the client region for S3.
          items:
            $ref: '#/components/schemas/StorageAccessConfig'
    PolicyType:
      description: The type of a policy
      type:
        - string
        - 'null'
      example: system.data-compaction
    PolicyIdentifier:
      type: object
      required:
        - namespace
        - name
      properties:
        namespace:
          $ref: '#/components/schemas/Namespace'
        name:
          type: string
    ListPoliciesResponse:
      type: object
      properties:
        next-page-token:
          $ref: '#/components/schemas/PageToken'
        identifiers:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PolicyIdentifier'
    PolicyName:
      type: string
      description: A policy name. A valid policy name should only consist of uppercase and lowercase letters (A-Z, a-z), digits (0-9), hyphens (-), underscores (_).
      pattern: ^[A-Za-z0-9\-_]+$
      example: compaction
    CreatePolicyRequest:
      type: object
      required:
        - name
        - type
      properties:
        name:
          $ref: '#/components/schemas/PolicyName'
        type:
          type: string
        description:
          type: string
        content:
          type: string
    Policy:
      type: object
      description: |
        A policy in Apache Polaris defines a set of rules for governing access, data usage, and operational consistency across various catalog resources. 
        Policies are stored within Polaris and can be attached to catalogs, namespaces, tables, or views.
        For example, they can be used for fine-grained control over who can perform specific actions on certain resources.

        The policy object includes
        - **policy-type:** The type of the policy, which determines the expected format and semantics of the policy content.
        - **inheritable:** A boolean flag indicating whether the policy is inheritable. 
        - **name:**  A human-readable name for the policy, which must be unique within a given namespace.
        - **description:** Detailed description of the purpose and functionalities of the policy.
        - **content:** Policy content, which can be validated against predefined schemas of a policy type.
        - **version:** Indicates the current version of the policy. Versions increased monotonically, the default value is 0

        Policies stored in Polaris serve as the persistent definition for access control and governance rules.
      required:
        - policy-type
        - name
        - version
        - inheritable
      properties:
        policy-type:
          type: string
        inheritable:
          type: boolean
        name:
          $ref: '#/components/schemas/PolicyName'
        description:
          type: string
        content:
          type: string
        version:
          type: integer
    LoadPolicyResponse:
      type: object
      properties:
        policy:
          $ref: '#/components/schemas/Policy'
    UpdatePolicyRequest:
      type: object
      properties:
        description:
          type: string
        content:
          type: string
        current-policy-version:
          type: integer
    PolicyAttachmentTarget:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          description: |
            Policy can be attached to different levels:
            1. table-like: Policies specific to individual tables or views.
            2. namespace: Policies applies to a namespace.
            3. catalog: Policies that applies to a catalog
          enum:
            - catalog
            - namespace
            - table-like
          example: table-like
        path:
          type: array
          items:
            type: string
          description: |
            A list representing the hierarchical path to the target, ordered from the namespace level down to the entity.

            If the target is catalog, the path should be either empty or not set.
          example:
            - NS1
            - NS2
            - test_table_1
    AttachPolicyRequest:
      type: object
      required:
        - target
      properties:
        target:
          $ref: '#/components/schemas/PolicyAttachmentTarget'
        parameters:
          type: object
          additionalProperties:
            type: string
    DetachPolicyRequest:
      type: object
      required:
        - target
      properties:
        target:
          $ref: '#/components/schemas/PolicyAttachmentTarget'
    ApplicablePolicy:
      allOf:
        - type: object
          description: |
            For policies returned by GetApplicablePolicies, there are 2 additional fields

            - **inherited:** A boolean flag indicating whether the policy is inherited from target's parents. For non-inheritable policy, it should always be `false`.
            - **namespace:** A list representing the hierarchical parent path to the policy, ordered from higher level namespace to lower.
          required:
            - inherited
            - namespace
          properties:
            inherited:
              type: boolean
              default: false
            namespace:
              $ref: '#/components/schemas/Namespace'
        - $ref: '#/components/schemas/Policy'
    GetApplicablePoliciesResponse:
      type: object
      required:
        - applicable-policies
      properties:
        next-page-token:
          $ref: '#/components/schemas/PageToken'
        applicable-policies:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ApplicablePolicy'
    SemanticModelName:
      type: string
      description: A semantic model name. A valid name consists of uppercase and lowercase letters (A-Z, a-z), digits (0-9), hyphens (-), and underscores (_).
      pattern: ^[A-Za-z0-9\-_]+$
      example: tpcds_retail_model
    SemanticModelIdentifier:
      type: object
      required:
        - namespace
        - name
      properties:
        namespace:
          $ref: '#/components/schemas/Namespace'
        name:
          $ref: '#/components/schemas/SemanticModelName'
    ListSemanticModelsResponse:
      type: object
      properties:
        next-page-token:
          $ref: '#/components/schemas/PageToken'
        identifiers:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/SemanticModelIdentifier'
    SemanticModelDocument:
      type: object
      description: An Apache Ossie document body.
      required:
        - version
        - semantic_model
      properties:
        version:
          type: string
          description: The Apache Ossie spec version.
          example: 0.2.0.dev0
        semantic_model:
          type: string
          description: The Apache Ossie semantic model serialized as a JSON object string.
      example:
        version: 0.2.0.dev0
        semantic_model: '{"name":"tpcds_retail_model","description":"retail analytics","datasets":[{"name":"store_sales","source":"public.store_sales","primary_key":["ss_item_sk","ss_ticket_number"]}],"metrics":[{"name":"total_sales","expression":{"dialects":[{"dialect":"ANSI_SQL","expression":"SUM(ss_ext_sales_price)"}]}}]}'
    CreateSemanticModelRequest:
      type: object
      required:
        - name
        - document
      properties:
        name:
          $ref: '#/components/schemas/SemanticModelName'
        document:
          $ref: '#/components/schemas/SemanticModelDocument'
    EntityVersion:
      type: string
      maxLength: 255
      description: |
        An opaque UTF-8 string (at most 255 characters) identifying a version of a semantic-model
        entity, used for optimistic concurrency. A create/load/update response returns the entity's
        current version; supply the value you last read on a subsequent update so the change applies
        only if it still matches the version stored in the catalog.
    LoadSemanticModelResponse:
      type: object
      required:
        - document
        - entity-version
      properties:
        document:
          $ref: '#/components/schemas/SemanticModelDocument'
        entity-version:
          $ref: '#/components/schemas/EntityVersion'
    UpdateSemanticModelRequest:
      type: object
      required:
        - document
        - entity-version
      properties:
        document:
          $ref: '#/components/schemas/SemanticModelDocument'
        entity-version:
          $ref: '#/components/schemas/EntityVersion'
    NextPageToken:
      description: |
        An opaque continuation token. A non-empty value means there is more to read, including after
        a short or empty page. Absent or null means completion; the server never returns an empty
        string. A full-result response carries no continuation token. Send it back unchanged as
        `pageToken`.
      type: string
      nullable: true
    TagId:
      type: string
      readOnly: true
      description: |
        A server-assigned opaque identity for comparisons within one realm and catalog. It survives
        updates and renames. Deletion and recreation under the same name produces a different id. Do
        not parse it or infer ordering. Operations address tags by name and use current-tag-version
        for concurrency checks.
      example: tag-8f31c2
    TagName:
      type: string
      description: |
        A catalog-unique tag definition name of at most 256 characters, containing only ASCII
        letters, digits, hyphens, and underscores. Leading hyphens are allowed.
      maxLength: 256
      pattern: ^[A-Za-z0-9\-_]+$
      example: sensitivity
    TagIdentifier:
      type: object
      description: |
        A tag definition named in a list result or an object-tag response, without its full
        definition.
      required:
        - id
        - name
      properties:
        id:
          $ref: '#/components/schemas/TagId'
        name:
          allOf:
            - $ref: '#/components/schemas/TagName'
          description: |
            The definition's current catalog-unique name, used to address requests.
    ListTagsResponse:
      type: object
      required:
        - identifiers
      properties:
        next-page-token:
          $ref: '#/components/schemas/NextPageToken'
        identifiers:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/TagIdentifier'
    PolarisErrorModel:
      type: object
      description: JSON error payload returned in a response with further details on the error
      required:
        - message
        - type
        - code
      properties:
        message:
          type: string
          description: Human-readable error message
        type:
          type: string
          description: The error type, which names the specific cause behind the HTTP status code
          example: NoSuchTag
        code:
          type: integer
          description: The HTTP status code of the response, repeated in the body
          example: 404
        stack:
          type: array
          items:
            type: string
    PolarisErrorResponse:
      description: |
        The error response body for Polaris-specific APIs, containing the error's HTTP status code,
        type, and message.
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/PolarisErrorModel'
      additionalProperties: false
      example:
        error:
          message: The given tag definition does not exist
          type: NoSuchTag
          code: 404
    CreateTagRequest:
      type: object
      required:
        - name
        - allowed-values
      properties:
        name:
          allOf:
            - $ref: '#/components/schemas/TagName'
          description: |
            The new definition's catalog-unique name, subject to TagName constraints.
        description:
          type: string
          description: |
            Optional classification description; it does not affect matching or inheritance.
        allowed-values:
          type: array
          items:
            type: string
          description: |
            The allowed assignment values: distinct, non-empty strings matched exactly and
            case-sensitively. The list must be non-empty. Each value is limited to 2000 bytes of
            decoded UTF-8 text, excluding JSON escaping. Invalid contents return 400 BadRequest.
    Tag:
      type: object
      description: |
        A tag definition.
      required:
        - id
        - name
        - allowed-values
        - version
      properties:
        id:
          $ref: '#/components/schemas/TagId'
        name:
          allOf:
            - $ref: '#/components/schemas/TagName'
          description: |
            The definition's current name. Renaming changes this value while preserving its id.
        description:
          type: string
          description: |
            Optional classification description; it does not affect matching or inheritance.
        allowed-values:
          type: array
          items:
            type: string
          description: |
            The allowed assignment values: distinct, non-empty strings matched exactly and
            case-sensitively. The list must be non-empty. Each value is limited to 2000 bytes of
            decoded UTF-8 text, excluding JSON escaping. Invalid contents return 400 BadRequest.
        version:
          type: string
          minLength: 1
          example: rev-a
          description: |
            An opaque, non-empty concurrency token. Send it unchanged as current-tag-version; do not
            parse, order, or increment it. A definition-changing write advances the token. A no-op
            update returns the current token without advancing it.

            The fields and token in one response describe the same revision. Token comparison and
            definition mutation are atomic across all supported definition-write paths, including
            native writes outside this API.

            A definition change invalidates earlier tokens even if its fields later return to their
            previous values. A token cannot authorize an update or rename of a same-name replacement
            or a different definition renamed into that name. No-op updates also require a matching
            token. Idempotency recognition precedes token comparison, as described by
            Idempotency-Key.

            Unrelated catalog changes may invalidate the token even when this definition is
            unchanged.
    RenameTagRequest:
      type: object
      description: |
        The source name, destination name, and current version token for a rename.
      required:
        - source
        - destination
        - current-tag-version
      properties:
        source:
          allOf:
            - $ref: '#/components/schemas/TagName'
          description: |
            The source definition's current name in the addressed catalog.
        destination:
          allOf:
            - $ref: '#/components/schemas/TagName'
          description: |
            A valid TagName that differs from source and is unused in the catalog.
        current-tag-version:
          type: string
          minLength: 1
          example: rev-b
          description: |
            The definition's current token from create, load, or update. Send it unchanged.
            Tag.version defines identity and concurrency semantics.
    UpdateTagRequest:
      type: object
      description: |
        The complete editable definition and the version token required to update it.
      required:
        - description
        - allowed-values
        - current-tag-version
      properties:
        description:
          type: string
          nullable: true
          description: |
            The required replacement description. Explicit null or an empty string clears it.
        allowed-values:
          type: array
          items:
            type: string
          description: |
            The allowed assignment values: distinct, non-empty strings matched exactly and
            case-sensitively. The list must be non-empty. Each value is limited to 2000 bytes of
            decoded UTF-8 text, excluding JSON escaping. Invalid contents return 400 BadRequest.
        current-tag-version:
          type: string
          minLength: 1
          example: rev-b
          description: |
            The definition's current token from create, load, or update. Send it unchanged.
            Tag.version defines identity and concurrency semantics.
    TargetType:
      type: string
      description: |
        The kind of target a tag applies to:

        - `CATALOG`: the catalog addressed by {prefix}.
        - `NAMESPACE`: a namespace.
        - `TABLE`: a whole Iceberg table or supported generic table.
        - `VIEW`: a whole Iceberg view.
        - `COLUMN`: one top-level column of an Iceberg table. Generic-table columns, view columns,
          and nested fields are unsupported.
      enum:
        - CATALOG
        - NAMESPACE
        - TABLE
        - VIEW
        - COLUMN
      example: TABLE
    TagAttachmentTarget:
      type: object
      description: |
        A catalog object or top-level Iceberg column, used in assignment writes and read results.
        The required `type` determines the fields:

        - `CATALOG`: path and column absent or empty.
        - `NAMESPACE`: path contains one or more namespace levels; column absent or empty.
        - `TABLE` or `VIEW`: path contains namespace levels followed by the entity name; column
          absent or empty.
        - `COLUMN`: path contains namespace levels followed by the Iceberg table name; column
          contains exactly one non-empty top-level column name.

        Supplied path and column fields must be arrays of strings, never null. Each path member must
        be non-empty; namespace levels must not contain U+001F. Names are original strings without
        URI encoding, percent decoding, dot splitting, or path normalization. For example, ["."] and
        [".."] address literal top-level column names. Catalog and schema naming rules apply.

        Assignments follow the identity of the definition and target, and the Iceberg field id for a
        column. Identity-preserving renames retain assignments. Dropping and recreating an object
        under the same name does not transfer its previous assignments.
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/TargetType'
        path:
          type: array
          items:
            type: string
          description: |
            Namespace levels followed by the table or view name when applicable, ordered from parent
            to child. Omit or use an empty array for a catalog. Members must be non-empty; a
            namespace level containing U+001F returns 400 BadRequest.
          example:
            - NS1
            - NS2
            - test_table_1
        column:
          type: array
          items:
            type: string
          description: |
            For a column target, exactly one non-empty, literal top-level column name.
          example:
            - email
    AssignTagRequest:
      type: object
      description: |
        The target and selected value for a direct assignment.
      required:
        - target
        - values
      properties:
        target:
          $ref: '#/components/schemas/TagAttachmentTarget'
        values:
          type: array
          items:
            type: string
          description: |
            Exactly one value from the definition's current allowed-values list. It must be
            non-empty and at most 2000 decoded UTF-8 bytes, excluding JSON escaping. Invalid
            contents return 400 BadRequest.
          example:
            - confidential
    UnassignTagRequest:
      type: object
      description: |
        The target whose direct assignment is removed. A values field must not be supplied,
        including null or an empty array; it returns 400 BadRequest.
      required:
        - target
      properties:
        target:
          $ref: '#/components/schemas/TagAttachmentTarget'
    TaggedObject:
      type: object
      description: |
        One direct assignment returned by listObjectsByTag. Its apply-method is never INHERITED.
      required:
        - target
        - values
        - apply-method
      properties:
        target:
          $ref: '#/components/schemas/TagAttachmentTarget'
        values:
          type: array
          uniqueItems: true
          items:
            type: string
        apply-method:
          type: string
          example: DIRECT
    ListObjectsByTagResponse:
      type: object
      required:
        - objects
      properties:
        next-page-token:
          $ref: '#/components/schemas/NextPageToken'
        objects:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/TaggedObject'
    ObjectTag:
      type: object
      description: |
        One tag returned by getObjectTags:

        - `tag`: the definition's stable id and current name.
        - `values`: exactly one selected value.
        - `apply-method`: `DIRECT` when stored on the queried target, or `INHERITED` when the
          winning assignment is stored on a parent. The server returns only these values; clients
          must tolerate unknown values.
        - `assigned-at`: the target storing the winning assignment, either the queried target or a
          parent.
      required:
        - tag
        - values
        - apply-method
        - assigned-at
      properties:
        tag:
          $ref: '#/components/schemas/TagIdentifier'
        values:
          type: array
          uniqueItems: true
          items:
            type: string
        apply-method:
          type: string
          example: DIRECT
        assigned-at:
          $ref: '#/components/schemas/TagAttachmentTarget'
    GetObjectTagsResponse:
      type: object
      required:
        - object-tags
      properties:
        next-page-token:
          $ref: '#/components/schemas/NextPageToken'
        object-tags:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ObjectTag'
  responses:
    BadRequestErrorResponse:
      description: Indicates a bad request error. It could be caused by an unexpected request body format or other forms of request validation failure, such as invalid json. Usually serves application/json content, although in some cases simple text/plain content might be returned by the server's middleware.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IcebergErrorResponse'
          example:
            error:
              message: Malformed request
              type: BadRequestException
              code: 400
    UnauthorizedResponse:
      description: Unauthorized. The REST Catalog SHOULD respond with the 401 UnauthorizedResponse when the access token provided is expired, revoked, malformed, or invalid for other reasons. The client MAY request a new access token and retry the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IcebergErrorResponse'
          example:
            error:
              message: Not authorized to make this request
              type: NotAuthorizedException
              code: 401
    ForbiddenResponse:
      description: Forbidden. Authenticated user does not have the necessary permissions.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IcebergErrorResponse'
          example:
            error:
              message: Not authorized to make this request
              type: NotAuthorizedException
              code: 403
    AuthenticationTimeoutResponse:
      description: This is an optional status response type that the REST Catalog can issue when the token has expired. The client MAY request a new access token and retry the request. 401 UnauthorizedResponse SHOULD be preferred over this response type on token expiry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IcebergErrorResponse'
          example:
            error:
              message: Credentials have timed out
              type: AuthenticationTimeoutException
              code: 419
    ServiceUnavailableResponse:
      description: |-
        The service is not ready to handle the request, request could have been partially processed.
        The service may additionally send a Retry-After header to indicate when to retry, a non idempotent request should only be retried by the client when the Retry-After header is present.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IcebergErrorResponse'
          example:
            error:
              message: Slow down
              type: SlowDownException
              code: 503
    ServerErrorResponse:
      description: A server-side problem that might not be addressable from the client side. Used for server 5xx errors without more specific documentation in individual routes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IcebergErrorResponse'
          example:
            error:
              message: Internal Server Error
              type: InternalServerError
              code: 500
    OAuthTokenResponse:
      description: OAuth2 token response for client credentials or token exchange
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuthTokenResponse'
    OAuthErrorResponse:
      description: OAuth2 error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuthError'
    ListNamespacesResponse:
      description: A list of namespaces
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ListNamespacesResponse'
          examples:
            NonEmptyResponse:
              $ref: '#/components/examples/ListNamespacesNonEmptyExample'
            EmptyResponse:
              $ref: '#/components/examples/ListNamespacesEmptyExample'
    CreateNamespaceResponse:
      description: Represents a successful call to create a namespace. Returns the namespace created, as well as any properties that were stored for the namespace, including those the server might have added. Implementations are not required to support namespace properties.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateNamespaceResponse'
          example:
            namespace:
              - accounting
              - tax
            properties:
              owner: Ralph
              created_at: '1452120468'
    UnsupportedOperationResponse:
      description: Not Acceptable / Unsupported Operation. The server does not support this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
          example:
            error:
              message: The server does not support this operation
              type: UnsupportedOperationException
              code: 406
    GetNamespaceResponse:
      description: Returns a namespace, as well as any properties stored on the namespace if namespace properties are supported by the server.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GetNamespaceResponse'
    UpdateNamespacePropertiesResponse:
      description: JSON data response for a synchronous update properties request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateNamespacePropertiesResponse'
          example:
            updated:
              - owner
            removed:
              - foo
            missing:
              - bar
    ListTablesResponse:
      description: A list of table identifiers
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ListTablesResponse'
          examples:
            ListTablesResponseNonEmpty:
              $ref: '#/components/examples/ListTablesNonEmptyExample'
            ListTablesResponseEmpty:
              $ref: '#/components/examples/ListTablesEmptyExample'
    CreateTableResponse:
      description: Table metadata result after creating a table
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoadTableResult'
      headers:
        etag:
          $ref: '#/components/headers/etag'
    LoadTableResponse:
      description: Table metadata result when loading a table
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoadTableResult'
      headers:
        etag:
          $ref: '#/components/headers/etag'
    CommitTableResponse:
      description: |-
        Response used when a table is successfully updated.
        The table metadata JSON is returned in the metadata field. The corresponding file location of table metadata must be returned in the metadata-location field. Clients can check whether metadata has changed by comparing metadata locations.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommitTableResponse'
      headers:
        etag:
          $ref: '#/components/headers/etag'
    LoadCredentialsResponse:
      description: Table credentials result when loading credentials for a table
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoadCredentialsResponse'
    RemoteSignResponse:
      description: The response containing signed & unsigned headers. The server will also send a Cache-Control header, indicating whether the response can be cached (Cache-Control = ["private"]) or not (Cache-Control = ["no-cache"]).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RemoteSignResult'
    LoadViewResponse:
      description: View metadata result when loading a view
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoadViewResult'
    ListGenericTablesResponse:
      description: List of generic table identifiers.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ListGenericTablesResponse'
    CreateGenericTableResponse:
      description: Table result if successfully created a generic table.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoadGenericTableResponse'
    LoadGenericTableResponse:
      description: Table result if successfully load a generic table.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoadGenericTableResponse'
    ListPoliciesResponse:
      description: a list of policy identifiers
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ListPoliciesResponse'
