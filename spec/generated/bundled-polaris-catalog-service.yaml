        backward-incompatible way.

        Replace a semantic model's document with a new one.

        Upon a successful update, the model's entity-version changes and the new value is returned.

        Updates use optimistic concurrency: supply the `entity-version` you last read for this
        model, and the update succeeds only if it matches the version currently stored in the
        catalog. A mismatch fails with 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSemanticModelRequest'
      responses:
        '200':
          $ref: '#/components/responses/UpdateSemanticModelResponse'
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          description: Not Found - the requested semantic model does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IcebergErrorResponse'
              examples:
                SemanticModelToUpdateDoesNotExist:
                  $ref: '#/components/examples/NoSuchSemanticModelError'
        '409':
          description: Conflict - the supplied entity-version does not match the stored version. The client may retry after fetching the latest version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IcebergErrorResponse'
              examples:
                SemanticModelVersionMismatch:
                  $ref: '#/components/examples/SemanticModelVersionMismatchError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
        5XX:
          $ref: '#/components/responses/ServerErrorResponse'
    delete:
      tags:
        - Semantic Model API
      summary: Drop a semantic model from the catalog
      operationId: dropSemanticModel
      description: |
        **Beta:** The semantic-model (Apache Ossie) API is under active development and may change in a
        backward-incompatible way.

        Remove a semantic model from the catalog.
      responses:
        '204':
          description: Success, no content
        '400':
          $ref: '#/components/responses/BadRequestErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          description: Not Found - the requested semantic model does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IcebergErrorResponse'
              examples:
                SemanticModelToDeleteDoesNotExist:
                  $ref: '#/components/examples/NoSuchSemanticModelError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
        5XX:
          $ref: '#/components/responses/ServerErrorResponse'
  /polaris/v1/{prefix}/tags:
    parameters:
      - $ref: '#/components/parameters/catalog-prefix'
    post:
      tags:
        - Tag API
      summary: Create a tag definition in the catalog
      operationId: createTag
      description: |
        Creates a tag definition within the catalog. A definition gives a classification a name and
        a set of allowed values. Assignments select exactly one allowed value for a catalog,
        namespace, table, view, or column.

        The request supplies a catalog-unique `name`, a non-empty `allowed-values` list, and an
        optional `description`. Value matching is exact and case-sensitive. CreateTagRequest
        describes the field constraints.

        Where idempotency is enabled, a retry uses the requested name to locate the original
        definition. If that definition has been renamed, a free name creates a new definition and an
        occupied name returns 409 AlreadyExists. Renaming the original definition back within the
        recognition window allows its key to be recognized again. The Idempotency-Key parameter
        defines retry behavior.

        Requires permission to create definitions in the catalog.
      parameters:
        - $ref: '#/components/parameters/tag-idempotency-key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTagRequest'
      responses:
        '200':
          $ref: '#/components/responses/CreateTagResponse'
        '400':
          description: |
            BadRequest covers an empty allowed-values list, duplicate or empty members, or a member
            exceeding 2000 decoded UTF-8 bytes. ValidationError covers missing required fields, null
            allowed-values, and schema validation failures. InvalidJson covers malformed JSON.
            InvalidIdempotencyKey covers a malformed non-blank header when idempotency support is
            enabled.

            Possible error types: BadRequest, ValidationError, InvalidJson, InvalidIdempotencyKey.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolarisErrorResponse'
              examples:
                InvalidAllowedValues:
                  $ref: '#/components/examples/AllowedValuesInvalidError'
                InvalidIdempotencyKey:
                  $ref: '#/components/examples/TagInvalidIdempotencyKeyError'
        '401':
          $ref: '#/components/responses/TagUnauthorizedResponse'
        '403':
          $ref: '#/components/responses/TagForbiddenResponse'
        '404':
          description: |
            Possible error types: NoSuchCatalog (the addressed catalog).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolarisErrorResponse'
        '409':
          description: |
            AlreadyExists means the requested name already belongs to a definition in this catalog.

            Possible error types: AlreadyExists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolarisErrorResponse'
              examples:
                AlreadyExists:
                  $ref: '#/components/examples/TagAlreadyExistsError'
        '503':
          $ref: '#/components/responses/TagServiceUnavailableResponse'
        5XX:
          $ref: '#/components/responses/TagServerErrorResponse'
    get:
      tags:
        - Tag API
      summary: List tag definition identifiers in the catalog
      operationId: listTags
      description: |
        Returns tag definition identifiers in the catalog.

        Pagination is enabled by default. Send `pagination=false` alone to request the complete
        result, subject to the response-size and work limits described by `pageSize`.

        Requires permission to read definitions in the catalog.
      parameters:
        - $ref: '#/components/parameters/tag-pagination'
        - $ref: '#/components/parameters/tag-page-token'
        - $ref: '#/components/parameters/tag-page-size'
      responses:
        '200':
          $ref: '#/components/responses/ListTagsResponse'
        '400':
          description: |
            ValidationError covers schema validation failures. BadRequest covers invalid or repeated
            pagination parameters, invalid or expired tokens, conflicting pagination modes,
            full-result requests exceeding response-size or work limits, and paged requests unable
            to make safe progress within their work budget. The pagination parameters define these
            cases.

            Possible error types: ValidationError, BadRequest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolarisErrorResponse'
        '401':
          $ref: '#/components/responses/TagUnauthorizedResponse'
        '403':
          $ref: '#/components/responses/TagForbiddenResponse'
        '404':
          description: |
            Possible error types: NoSuchCatalog (the addressed catalog).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolarisErrorResponse'
        '503':
          $ref: '#/components/responses/TagServiceUnavailableResponse'
        5XX:
          $ref: '#/components/responses/TagServerErrorResponse'
  /polaris/v1/{prefix}/tags/rename:
    parameters:
      - $ref: '#/components/parameters/catalog-prefix'
    post:
      tags:
        - Tag API
      summary: Rename a tag definition
      operationId: renameTag
      description: |
        Renames a tag definition without changing its id, description, allowed values, or
        assignments. The version token changes when the rename succeeds.

        `current-tag-version` must match the source definition's current token. Comparison and
        rename are atomic. A stale token or one identifying a different definition returns 409
        TagVersionMismatch, including after a same-name replacement. Tag.version defines the token's
        identity and concurrency guarantees.

        A successful rename and a recognized retry both return 204 without a body. A recognized
        retry does not rename the definition again, even after later renames or other changes. This
        also applies to a concurrent duplicate that recognizes the completed write. The
        Idempotency-Key parameter defines recognition. An ordinary request using the old name may
        return 404 NoSuchTag. Clients needing the current version can load the definition
        separately.

        Requires permission to delete the source definition and to create a definition in the
        catalog. Permission to modify the source alone is insufficient. No permission to read the
        definition is required for rename.
      parameters:
        - $ref: '#/components/parameters/tag-idempotency-key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameTagRequest'
      responses:
        '204':
          description: |
            The definition was renamed, or the request was recognized as an earlier successful
            rename. No content is returned. A recognized retry does not rename the definition again.
        '400':
          description: |
            BadRequest covers an invalid destination name or a destination equal to the source.
            ValidationError covers missing required fields, schema-type violations, and a missing,
            null, empty, or non-string current-tag-version. InvalidJson covers malformed
            JSON. InvalidIdempotencyKey covers a malformed non-blank header when idempotency support
            is enabled.

            Possible error types: BadRequest, ValidationError, InvalidJson, InvalidIdempotencyKey.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolarisErrorResponse'
              examples:
                InvalidDestination:
                  $ref: '#/components/examples/RenameDestinationInvalidError'
                InvalidIdempotencyKey:
                  $ref: '#/components/examples/TagInvalidIdempotencyKeyError'
        '401':
          $ref: '#/components/responses/TagUnauthorizedResponse'
        '403':
          $ref: '#/components/responses/TagForbiddenResponse'
        '404':
          description: |
            Possible error types: NoSuchCatalog (the addressed catalog), NoSuchTag (the source
            definition).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolarisErrorResponse'
              examples:
                SourceToRenameDoesNotExist:
                  $ref: '#/components/examples/NoSuchTagError'
        '409':
          description: |
            AlreadyExists means the destination name is occupied. TagVersionMismatch means the
            supplied token does not match the source definition. Reload the definition before
            retrying with a new token. CommitConflict means a concurrent change prevented the
            rename; the request may be retried.

            Possible error types: AlreadyExists, TagVersionMismatch, CommitConflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolarisErrorResponse'
              examples:
                DestinationAlreadyExists:
                  $ref: '#/components/examples/TagAlreadyExistsError'
                TagVersionMismatch:
                  $ref: '#/components/examples/TagVersionMismatchError'
                TagConcurrentlyModified:
                  $ref: '#/components/examples/TagCommitConflictError'
        '503':
          $ref: '#/components/responses/TagServiceUnavailableResponse'
        5XX:
          $ref: '#/components/responses/TagServerErrorResponse'
  /polaris/v1/{prefix}/tags/{tag-name}:
    parameters:
      - $ref: '#/components/parameters/catalog-prefix'
      - $ref: '#/components/parameters/tag-name'
    get:
      tags:
        - Tag API
      summary: Load a tag definition
      operationId: loadTag
      description: |
        Loads the tag definition, including its stable id, current name, description, allowed
        values, and version token.

        Requires permission to read the definition.
      responses:
        '200':
          $ref: '#/components/responses/LoadTagResponse'
        '400':
          $ref: '#/components/responses/TagBadRequestResponse'
        '401':
          $ref: '#/components/responses/TagUnauthorizedResponse'
        '403':
          $ref: '#/components/responses/TagForbiddenResponse'
        '404':
          description: |
            Possible error types: NoSuchCatalog (the addressed catalog), NoSuchTag (the tag
            definition).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolarisErrorResponse'
              examples:
                TagToGetDoesNotExist:
                  $ref: '#/components/examples/NoSuchTagError'
        '503':
          $ref: '#/components/responses/TagServiceUnavailableResponse'
        5XX:
          $ref: '#/components/responses/TagServerErrorResponse'
    put:
      tags:
        - Tag API
      summary: Update a tag definition
      operationId: updateTag
      description: |
        Replaces the definition's description and allowed-values list. Both fields are required;
        send the current value to keep it. An explicit JSON null or empty description clears it.
        Renaming uses renameTag.

        Changing allowed values does not rewrite existing assignments. An assignment whose value is
        removed remains readable until replaced or unassigned. Later assignments must use a value
        from the updated list.

        `current-tag-version` must match the definition's current token, including when no fields
        would change. A mismatch returns 409 TagVersionMismatch. The comparison and update are
        atomic. Tag.version defines the token's identity and concurrency guarantees.

        A successful update returns the resulting definition and token. A no-op update leaves both
        unchanged. A concurrent write may invalidate the returned token before the caller receives
        it.

        A no-op update may or may not register an idempotency key; registration does not advance its
        version. If its key is not recognized after the definition changes, retrying the no-op
        returns 409 TagVersionMismatch. A recognized retry returns the current definition without
        applying the update again, as described by Idempotency-Key.

        Requires permission to modify the definition.
      parameters:
        - $ref: '#/components/parameters/tag-idempotency-key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTagRequest'
      responses:
        '200':
          $ref: '#/components/responses/UpdateTagResponse'
        '400':
          description: |
            BadRequest covers an empty allowed-values list, duplicate or empty members, or a member
            exceeding 2000 decoded UTF-8 bytes. ValidationError covers missing required fields, null
            allowed-values, and schema violations, including a missing, null, empty, or non-string
            current-tag-version. An explicit null update description is valid. InvalidJson covers
            malformed JSON. InvalidIdempotencyKey covers a malformed
            non-blank header when idempotency support is enabled.

            Possible error types: BadRequest, ValidationError, InvalidJson, InvalidIdempotencyKey.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolarisErrorResponse'
              examples:
                InvalidAllowedValues:
                  $ref: '#/components/examples/AllowedValuesInvalidError'
                InvalidIdempotencyKey:
                  $ref: '#/components/examples/TagInvalidIdempotencyKeyError'
        '401':
          $ref: '#/components/responses/TagUnauthorizedResponse'
        '403':
          $ref: '#/components/responses/TagForbiddenResponse'
        '404':
          description: |
            Possible error types: NoSuchCatalog (the addressed catalog), NoSuchTag (the tag
            definition).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolarisErrorResponse'
              examples:
                TagToUpdateDoesNotExist:
                  $ref: '#/components/examples/NoSuchTagError'
        '409':
          description: |
            TagVersionMismatch means the supplied token does not match the definition, including a
            no-op update. CommitConflict means a concurrent change prevented the update. Reload the
            definition and retry with its current token.

            Possible error types: TagVersionMismatch, CommitConflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolarisErrorResponse'
              examples:
                TagVersionMismatch:
                  $ref: '#/components/examples/TagVersionMismatchError'
                TagConcurrentlyModified:
                  $ref: '#/components/examples/TagCommitConflictError'
        '503':
          $ref: '#/components/responses/TagServiceUnavailableResponse'
        5XX:
          $ref: '#/components/responses/TagServerErrorResponse'
    delete:
      tags:
        - Tag API
      summary: Drop a tag definition from the catalog
      operationId: dropTag
      description: |
        Permanently deletes the tag definition and releases its name.

        Without `detach-all=true`, an assignment on a live target prevents deletion with 400
        TagInUse. Assignments confirmed orphaned or belonging to soft-dropped targets do not prevent
        deletion. Deleting the definition makes these assignments permanently ineffective, including
        if a soft-dropped target is restored later.

        With `detach-all=true`, deletion removes the definition and all its assignments atomically
        from Tag API reads and reverse lookups. A read beginning after success cannot return any
        assignment of the deleted definition. A failure before deletion completes leaves visible
        state unchanged; a later cleanup failure cannot restore the deleted definition or
        assignments.

        A failure to load a required entity or schema metadata is an error, not evidence of absence.
        It leaves visible state unchanged. Transient execution failures use the server-error
        responses.

        Requires permission to delete the definition. `detach-all=true` also requires
        definition-side permission to detach assignments, even if none exist. No per-target
        permission is required. This operation does not recognize completed requests through
        Idempotency-Key.
      parameters:
        - $ref: '#/components/parameters/tag-idempotency-key'
        - name: detach-all
          in: query
          required: false
          description: |
            When true, dropTag also deletes every assignment of this definition across the catalog.
          schema:
            type: boolean
            default: false
          example: false
      responses:
        '204':
          description: Success, no content
        '400':
          description: |
            TagInUse means an assignment on a live target prevents deletion without
            `detach-all=true`. InvalidIdempotencyKey covers a malformed non-blank header when
            idempotency support is enabled.

            Possible error types: TagInUse, InvalidIdempotencyKey.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolarisErrorResponse'
              examples:
                TagInUse:
                  $ref: '#/components/examples/TagInUseError'
        '401':
          $ref: '#/components/responses/TagUnauthorizedResponse'
        '403':
          $ref: '#/components/responses/TagForbiddenResponse'
        '404':
          description: |
            Possible error types: NoSuchCatalog (the addressed catalog), NoSuchTag (the tag
            definition).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolarisErrorResponse'
              examples:
                TagToDeleteDoesNotExist:
                  $ref: '#/components/examples/NoSuchTagError'
        '503':
          $ref: '#/components/responses/TagServiceUnavailableResponse'
        5XX:
          $ref: '#/components/responses/TagServerErrorResponse'
  /polaris/v1/{prefix}/tags/{tag-name}/assign:
    parameters:
      - $ref: '#/components/parameters/catalog-prefix'
      - $ref: '#/components/parameters/tag-name'
    post:
      tags:
        - Tag API
      summary: Assign a tag to a target
      operationId: assignTag
      description: |
        Sets the direct assignment of this tag definition on one target. Reassigning the same tag on
        the same target replaces its selected value.

        The JSON body supplies a `target` and `values` containing exactly one value from the
        definition's current allowed-values list. TagAttachmentTarget defines the supported kinds,
        address fields, and identity rules. Names are original JSON strings without URI encoding.
        The target must belong to the catalog addressed by {prefix}.

        An absent, null, or empty values list is invalid and never removes an assignment. A rejected
        request changes no assignment. Changes to unrelated target properties do not cause a
        conflict. This operation does not recognize completed requests through Idempotency-Key.

        Requires permission to attach on the definition and to attach a tag on the target. A column
        target is authorized through its containing table.
      parameters:
        - $ref: '#/components/parameters/tag-idempotency-key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTagRequest'
            examples:
              AssignColumn:
                summary: Assign a value to the literal top-level column named '.'
                value:
                  target:
                    type: COLUMN
                    path:
                      - sales
                      - eu
                      - customers
                    column:
                      - .
                  values:
                    - confidential
      responses:
        '204':
          description: Success, no content
        '400':
          description: |
            BadRequest covers an unsupported target kind, an incomplete or malformed address, null
            or empty values, empty or duplicate members, more than one selected value, a value
            exceeding 2000 decoded UTF-8 bytes, or a value absent from the definition's
            allowed-values list.

            ValidationError covers a missing, null, or non-object `target`, missing or null
            `target.type`, missing `values`, non-null `values` that is not an array, and other
            schema-type violations. The BadRequest cases above take precedence, including unknown
            target kinds and null values. InvalidJson covers malformed JSON. InvalidIdempotencyKey
            covers a malformed non-blank header when idempotency support is enabled.

            Possible error types: BadRequest, ValidationError, InvalidJson, InvalidIdempotencyKey.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolarisErrorResponse'
              examples:
                UnsupportedTarget:
                  $ref: '#/components/examples/UnsupportedTargetError'
                InvalidValues:
                  $ref: '#/components/examples/ValuesInvalidError'
                MultipleValuesNotSupported:
                  $ref: '#/components/examples/MultipleValuesNotSupportedError'
                ValueNotAllowed:
                  $ref: '#/components/examples/ValueInvalidError'
        '401':
          $ref: '#/components/responses/TagUnauthorizedResponse'
        '403':
          $ref: '#/components/responses/TagForbiddenResponse'
        '404':
          description: |
            Possible error types: NoSuchCatalog (the addressed catalog), NoSuchTag (the definition),
            NoSuchTarget (the target or column).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolarisErrorResponse'
              examples:
                TagDoesNotExist:
                  $ref: '#/components/examples/NoSuchTagError'
                TargetDoesNotExist:
                  $ref: '#/components/examples/examples-NoSuchTargetError'
        '503':
          $ref: '#/components/responses/TagServiceUnavailableResponse'
        5XX:
          $ref: '#/components/responses/TagServerErrorResponse'
  /polaris/v1/{prefix}/tags/{tag-name}/unassign:
    parameters:
      - $ref: '#/components/parameters/catalog-prefix'
      - $ref: '#/components/parameters/tag-name'
    post:
      tags:
        - Tag API
      summary: Remove a direct tag assignment from a target
      operationId: unassignTag
      description: |
        Removes the direct assignment of this tag definition from one target. Removing a direct
        assignment may reveal an inherited value. The definition's allowed-values list is not
        checked.

        The JSON body supplies only a `target`; a `values` field is invalid, including null or an
        empty array. TagAttachmentTarget defines the supported kinds, address fields, and identity
        rules. Names are original JSON strings without URI encoding. The target must belong to the
        catalog addressed by {prefix}.

        If no direct assignment exists, the request returns 404 NoSuchAssignment. Completed requests
        are not recognized through Idempotency-Key, so retrying a successful removal returns 404
        while the assignment remains absent. A rejected request changes no assignment. Changes to
        unrelated target properties do not cause a conflict.

        Requires permission to detach on the definition and to detach a tag from the target. A
        column target is authorized through its containing table.
      parameters:
        - $ref: '#/components/parameters/tag-idempotency-key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnassignTagRequest'
            examples:
              UnassignColumn:
                summary: Remove the direct assignment from the literal top-level column named '.'
                value:
                  target:
                    type: COLUMN
                    path:
                      - sales
                      - eu
                      - customers
                    column:
                      - .
      responses:
        '204':
          description: Success, no content
        '400':
          description: |
            BadRequest covers an unsupported target kind, an incomplete or malformed address, or a
            supplied `values` field, including null or an empty array.

            ValidationError covers a missing, null, or non-object `target`, missing or null
            `target.type`, and other schema-type violations. The BadRequest cases above take
            precedence, including unknown target kinds and a supplied values field. InvalidJson
            covers malformed JSON. InvalidIdempotencyKey covers a malformed non-blank header when
            idempotency support is enabled.

            Possible error types: BadRequest, ValidationError, InvalidJson, InvalidIdempotencyKey.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolarisErrorResponse'
              examples:
                UnsupportedTarget:
                  $ref: '#/components/examples/UnsupportedTargetError'
        '401':
          $ref: '#/components/responses/TagUnauthorizedResponse'
        '403':
          $ref: '#/components/responses/TagForbiddenResponse'
        '404':
          description: |
            Possible error types: NoSuchCatalog (the addressed catalog), NoSuchTag (the definition),
            NoSuchTarget (the target or column), NoSuchAssignment (the direct assignment).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolarisErrorResponse'
              examples:
                TagDoesNotExist:
                  $ref: '#/components/examples/NoSuchTagError'
                TargetDoesNotExist:
                  $ref: '#/components/examples/examples-NoSuchTargetError'
                AssignmentToRemoveDoesNotExist:
                  $ref: '#/components/examples/NoSuchAssignmentError'
        '503':
          $ref: '#/components/responses/TagServiceUnavailableResponse'
        5XX:
          $ref: '#/components/responses/TagServerErrorResponse'
  /polaris/v1/{prefix}/tags/{tag-name}/assignments:
    parameters:
      - $ref: '#/components/parameters/catalog-prefix'
      - $ref: '#/components/parameters/tag-name'
    get:
      tags:
        - Tag API
      summary: List targets that carry a direct assignment of a tag
      operationId: listObjectsByTag
      description: |
        Returns targets with a direct assignment of the named tag definition. Targets that only
        inherit the tag are excluded. Without `value`, all direct assignments are eligible; with it,
        only assignments selecting that exact, case-sensitive value are eligible.

        Pagination is enabled by default. Send `pagination=false` alone to request the complete
        result, subject to the response-size and work limits described by `pageSize`. Filtering and
        work limits may produce a short or empty page with a continuation token.

        Requires read permission on the definition and each reported target. Columns are authorized
        through their containing tables. Catalog permission does not replace per-target
        authorization. Targets the caller cannot read are omitted. Authorization-system failures
        fail the request.

        Dropped, soft-dropped, or missing targets and removed columns are omitted. A failure to load
        metadata is an error, not evidence that a target is absent.
      parameters:
        - $ref: '#/components/parameters/tag-pagination'
        - name: value
          in: query
          required: false
          description: |
            Return only direct assignments selecting this exact, case-sensitive value.
          schema:
            type: string
          example: confidential
        - $ref: '#/components/parameters/tag-page-token'
        - $ref: '#/components/parameters/tag-page-size'
      responses:
        '200':
          $ref: '#/components/responses/ListObjectsByTagResponse'
        '400':
          description: |
            ValidationError covers schema validation failures. BadRequest covers invalid or repeated
            pagination parameters, invalid or expired tokens, conflicting pagination modes,
            full-result requests exceeding response-size or work limits, and paged requests unable
            to make safe progress within their work budget. The pagination parameters define these
            cases.

            Possible error types: ValidationError, BadRequest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolarisErrorResponse'
        '401':
          $ref: '#/components/responses/TagUnauthorizedResponse'
        '403':
          $ref: '#/components/responses/TagForbiddenResponse'
        '404':
          description: |
            Possible error types: NoSuchCatalog (the addressed catalog), NoSuchTag (the tag
            definition).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolarisErrorResponse'
              examples:
                TagToListDoesNotExist:
                  $ref: '#/components/examples/NoSuchTagError'
        '503':
          $ref: '#/components/responses/TagServiceUnavailableResponse'
        5XX:
          $ref: '#/components/responses/TagServerErrorResponse'
  /polaris/v1/{prefix}/object-tags:
    parameters:
      - $ref: '#/components/parameters/catalog-prefix'
    get:
      tags:
        - Tag API
      summary: Get the tags of a catalog, namespace, table, view, or column
      operationId: getObjectTags
      description: |
        Retrieves tags for one target identified by `target-type` and the query parameters that kind
        requires. The `target-type` parameter defines valid combinations. The optional `view`
        selects:

        - `direct` (default): assignments stored on the queried target.
        - `effective`: one winning assignment per tag definition from the target and its parents.
          The closest assignment wins: column, table or view, nearest namespace, then catalog.
          Values from different levels are never combined.

        Both views paginate by default. Send `pagination=false` alone to request all tags of the
        target, subject to the response-size and work limits described by `pageSize`.

        The hierarchy, definitions, and assignments used for one response are consistent with a
        single logical point in time. No snapshot consistency is guaranteed across separate pages.
        An effective read considers the complete hierarchy, even when paginated. If it cannot do so,
        the request
        fails; it never returns a partial hierarchy or falls back to a direct read.

        Results omit soft-dropped targets and assignments whose definition, target entity, or field
        is permanently absent.

        Requires read permission on the queried target, or its containing table for a column. This
        permission covers all effective tags, without per-parent or per-definition authorization.

        Query parameters address the same objects as TagAttachmentTarget: `namespace` carries the
        namespace levels, `target-name` the table or view name, and `column` the literal column
        name. For example, sales.eu.customers.email is addressed by:

        `?target-type=COLUMN&namespace=sales%1Feu&target-name=customers&column=email&view=effective`

        The catalog is addressed by `?target-type=CATALOG`, with no namespace, target-name, or
        column. Each address parameter and `view` may occur only once. Present empty values and
        empty namespace levels are invalid. Missing `target-type` returns 400 ValidationError.
      parameters:
        - $ref: '#/components/parameters/tag-pagination'
        - $ref: '#/components/parameters/target-type'
        - $ref: '#/components/parameters/target-namespace'
        - $ref: '#/components/parameters/target-name'
        - $ref: '#/components/parameters/target-column'
        - $ref: '#/components/parameters/tag-page-token'
        - $ref: '#/components/parameters/tag-page-size'
        - name: view
          in: query
          required: false
          description: |
            Which read to perform. Omitting this parameter is the same as `direct`. A present but
            empty or unknown value returns 400 BadRequest, and the parameter appears at
            most once.
          schema:
            type: string
            default: direct
            enum:
              - direct
              - effective
          example: effective
      responses:
        '200':
          $ref: '#/components/responses/GetObjectTagsResponse'
        '400':
          description: |
            ValidationError covers a missing required `target-type` or other schema validation
            failures. BadRequest covers unsupported kinds, invalid address combinations, repeated
            address parameters, empty address values or namespace levels, and empty or unknown
            `view` or `target-type` values. The BadRequest cases take precedence over schema
            validation.

            BadRequest also covers invalid or repeated pagination parameters, invalid or expired
            tokens, conflicting pagination modes, full-result requests exceeding response-size or
            work limits, and paged requests unable to make safe progress within their work budget.

            Malformed URI escapes may receive an HTTP-layer 400 response without a Tag error
            payload.

            Possible error types: ValidationError, BadRequest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolarisErrorResponse'
              examples:
                UnsupportedTarget:
                  $ref: '#/components/examples/UnsupportedTargetError'
                InvalidTargetQuery:
                  $ref: '#/components/examples/InvalidTargetQueryError'
        '401':
          $ref: '#/components/responses/TagUnauthorizedResponse'
        '403':
          $ref: '#/components/responses/TagForbiddenResponse'
        '404':
          description: |
            Possible error types: NoSuchCatalog (the addressed catalog), NoSuchTarget (the target or
            column).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolarisErrorResponse'
              examples:
                TargetToReadDoesNotExist:
                  $ref: '#/components/examples/examples-NoSuchTargetError'
        '503':
          $ref: '#/components/responses/TagServiceUnavailableResponse'
        5XX:
          $ref: '#/components/responses/TagServerErrorResponse'
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      description: |-
        This scheme is used for OAuth2 authorization.

        For unauthorized requests, services should return an appropriate 401 or 403 response. Implementations must not return altered success (200) responses when a request is unauthenticated or unauthorized.
        If a separate authorization server is used, substitute the tokenUrl with the full token path of the external authorization server, and use the resulting token to access the resources defined in the spec.
      flows:
        clientCredentials:
          tokenUrl: /v1/oauth/tokens
          scopes:
            catalog: Allows interacting with the Config and Catalog APIs
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    CatalogConfig:
      type: object
      description: Server-provided configuration for the catalog.
      required:
        - defaults
        - overrides
      properties:
        overrides:
          type: object
          additionalProperties:
            type: string
          description: Properties that should be used to override client configuration; applied after defaults and client configuration.
        defaults:
          type: object
          additionalProperties:
            type: string
          description: Properties that should be used as default configuration; applied before client configuration.
        endpoints:
          type: array
          items:
            type: string
          description: A list of endpoints that the server supports. The format of each endpoint must be "<HTTP verb> <resource path from OpenAPI REST spec>". The HTTP verb and the resource path must be separated by a space character.
          example:
            - GET /v1/{prefix}/namespaces/{namespace}
            - GET /v1/{prefix}/namespaces
            - POST /v1/{prefix}/namespaces
            - GET /v1/{prefix}/namespaces/{namespace}/tables/{table}
            - GET /v1/{prefix}/namespaces/{namespace}/views/{view}
        idempotency-key-lifetime:
          type: string
          format: duration
          description: Client reuse window for an Idempotency-Key (ISO-8601 duration, e.g., PT30M, PT24H). Interpreted as the maximum time from the first submission using a key to the last retry during which a client may reuse that key. Servers SHOULD accept retries for at least this duration and MAY include a grace period to account for delays/clock skew. Clients SHOULD NOT reuse an Idempotency-Key after this window elapses; they SHOULD generate a new key for any subsequent attempt. Presence of this field indicates the server supports Idempotency-Key semantics for mutation endpoints. If absent, clients MUST assume idempotency is not supported.
          example: PT30M
    ErrorModel:
      type: object
      description: JSON error payload returned in a response with further details on the error
      required:
        - message
        - type
        - code
      properties:
        message:
          type: string
          description: Human-readable error message
        type:
          type: string
          description: Internal type definition of the error
          example: NoSuchNamespaceException
        code:
          type: integer
          minimum: 400
          maximum: 600
          description: HTTP response code
          example: 404
        stack:
          type: array
          items:
            type: string
    IcebergErrorResponse:
      description: JSON wrapper for all error responses (non-2xx)
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorModel'
      additionalProperties: false
      example:
        error:
          message: The server does not support this operation
          type: UnsupportedOperationException
          code: 406
    OAuthClientCredentialsRequest:
      deprecated: true
      description: |-
        The `oauth/tokens` endpoint and related schemas are **DEPRECATED for REMOVAL** from this spec, see description of the endpoint.

        OAuth2 client credentials request

        See https://datatracker.ietf.org/doc/html/rfc6749#section-4.4
      type: object
      required:
        - grant_type
        - client_id
        - client_secret
      properties:
        grant_type:
          type: string
          enum:
            - client_credentials
        scope:
          type: string
        client_id:
          type: string
          description: |-
            Client ID

            This can be sent in the request body, but OAuth2 recommends sending it in a Basic Authorization header.
        client_secret:
          type: string
          description: |-
            Client secret

            This can be sent in the request body, but OAuth2 recommends sending it in a Basic Authorization header.
    TokenType:
      type: string
      enum:
        - urn:ietf:params:oauth:token-type:access_token
        - urn:ietf:params:oauth:token-type:refresh_token
        - urn:ietf:params:oauth:token-type:id_token
        - urn:ietf:params:oauth:token-type:saml1
        - urn:ietf:params:oauth:token-type:saml2
        - urn:ietf:params:oauth:token-type:jwt
      description: |-
        Token type identifier, from RFC 8693 Section 3

        See https://datatracker.ietf.org/doc/html/rfc8693#section-3
    OAuthTokenExchangeRequest:
      deprecated: true
      description: |-
        The `oauth/tokens` endpoint and related schemas are **DEPRECATED for REMOVAL** from this spec, see description of the endpoint.

        OAuth2 token exchange request

        See https://datatracker.ietf.org/doc/html/rfc8693
      type: object
      required:
        - grant_type
        - subject_token
        - subject_token_type
      properties:
        grant_type:
          type: string
          enum:
            - urn:ietf:params:oauth:grant-type:token-exchange
        scope:
          type: string
        requested_token_type:
          $ref: '#/components/schemas/TokenType'
        subject_token:
          type: string
          description: Subject token for token exchange request
        subject_token_type:
          $ref: '#/components/schemas/TokenType'
        actor_token:
          type: string
          description: Actor token for token exchange request
        actor_token_type:
          $ref: '#/components/schemas/TokenType'
    OAuthTokenRequest:
      deprecated: true
      description: The `oauth/tokens` endpoint and related schemas are **DEPRECATED for REMOVAL** from this spec, see description of the endpoint.
      anyOf:
        - $ref: '#/components/schemas/OAuthClientCredentialsRequest'
        - $ref: '#/components/schemas/OAuthTokenExchangeRequest'
    OAuthTokenResponse:
      deprecated: true
      description: The `oauth/tokens` endpoint and related schemas are **DEPRECATED for REMOVAL** from this spec, see description of the endpoint.
      type: object
      required:
        - access_token
        - token_type
      properties:
        access_token:
          type: string
          description: The access token, for client credentials or token exchange
        token_type:
          type: string
          enum:
            - bearer
            - mac
            - N_A
          description: |-
            Access token type for client credentials or token exchange

            See https://datatracker.ietf.org/doc/html/rfc6749#section-7.1
        expires_in:
          type: integer
          description: Lifetime of the access token in seconds for client credentials or token exchange
        issued_token_type:
          $ref: '#/components/schemas/TokenType'
        refresh_token:
          type: string
          description: Refresh token for client credentials or token exchange
        scope:
          type: string
          description: Authorization scope for client credentials or token exchange
    OAuthError:
      deprecated: true
      description: The `oauth/tokens` endpoint and related schemas are **DEPRECATED for REMOVAL** from this spec, see description of the endpoint.
      type: object
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_client
            - invalid_grant
            - unauthorized_client
            - unsupported_grant_type
            - invalid_scope
        error_description:
          type: string
        error_uri:
          type: string
    PageToken:
      description: |-
        An opaque token that allows clients to make use of pagination for list APIs (e.g. ListTables). Clients may initiate the first paginated request by sending an empty query parameter `pageToken` to the server.
        Servers that support pagination should identify the `pageToken` parameter and return a `next-page-token` in the response if there are more results available.  After the initial request, the value of `next-page-token` from each response must be used as the `pageToken` parameter value for the next request. The server must return `null` value for the `next-page-token` in the last response.
        Servers that support pagination must return all results in a single response with the value of `next-page-token` set to `null` if the query parameter `pageToken` is not set in the request.
        Servers that do not support pagination should ignore the `pageToken` parameter and return all results in a single response. The `next-page-token` must be omitted from the response.
        Clients must interpret either `null` or missing response value of `next-page-token` as the end of the listing results.
      type:
        - string
        - 'null'
    Namespace:
      description: Reference to one or more levels of a namespace
      type: array
      items:
        type: string
      example:
        - accounting
        - tax
    ListNamespacesResponse:
      type: object
      properties:
        next-page-token:
          $ref: '#/components/schemas/PageToken'
        namespaces:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Namespace'
    CreateNamespaceRequest:
      type: object
      required:
        - namespace
      properties:
        namespace:
          $ref: '#/components/schemas/Namespace'
        properties:
          type: object
          description: Configured string to string map of properties for the namespace
          example:
            owner: Hank Bendickson
          default: {}
          additionalProperties:
            type: string
    CreateNamespaceResponse:
      type: object
      required:
        - namespace
      properties:
        namespace:
          $ref: '#/components/schemas/Namespace'
        properties:
          type: object
          additionalProperties:
            type: string
          description: Properties stored on the namespace, if supported by the server.
          example:
            owner: Ralph
            created_at: '1452120468'
          default: {}
    GetNamespaceResponse:
      type: object
      required:
        - namespace
      properties:
        namespace:
          $ref: '#/components/schemas/Namespace'
        properties:
          type:
            - object
            - 'null'
          description: Properties stored on the namespace, if supported by the server. If the server does not support namespace properties, it should return null for this field. If namespace properties are supported, but none are set, it should return an empty object.
          additionalProperties:
            type: string
          example:
            owner: Ralph
            transient_lastDdlTime: '1452120468'
          default: {}
    UpdateNamespacePropertiesRequest:
      type: object
      properties:
        removals:
          type: array
          uniqueItems: true
          items:
            type: string
          example:
            - department
            - access_group
        updates:
          type: object
          example:
            owner: Hank Bendickson
          additionalProperties:
            type: string
    UpdateNamespacePropertiesResponse:
      type: object
      required:
        - updated
        - removed
      properties:
        updated:
          description: List of property keys that were added or updated
          type: array
          uniqueItems: true
          items:
            type: string
        removed:
          description: List of properties that were removed
          type: array
          items:
            type: string
        missing:
          type:
            - array
            - 'null'
          items:
            type: string
          description: List of properties requested for removal that were not found in the namespace's properties. Represents a partial success response. Server's do not need to implement this.
    TableIdentifier:
      type: object
      required:
        - namespace
        - name
      properties:
        namespace:
          $ref: '#/components/schemas/Namespace'
        name:
          type: string
    ListTablesResponse:
      type: object
      properties:
        next-page-token:
          $ref: '#/components/schemas/PageToken'
        identifiers:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/TableIdentifier'
    VariantType:
      type: string
      const: variant
    PrimitiveType:
      type: string
      example:
        - long
        - string
        - fixed[16]
        - decimal(10,2)
    StructType:
      type: object
      required:
        - type
        - fields
      properties:
        type:
          type: string
          const: struct
        fields:
          type: array
          items:
            $ref: '#/components/schemas/StructField'
    Type:
      oneOf:
        - $ref: '#/components/schemas/VariantType'
        - $ref: '#/components/schemas/PrimitiveType'
        - $ref: '#/components/schemas/StructType'
        - $ref: '#/components/schemas/ListType'
        - $ref: '#/components/schemas/MapType'
    ListType:
      type: object
      required:
        - type
        - element-id
        - element
        - element-required
      properties:
        type:
          type: string
          const: list
        element-id:
          type: integer
        element:
          $ref: '#/components/schemas/Type'
        element-required:
          type: boolean
    MapType:
      type: object
      required:
        - type
        - key-id
        - key
        - value-id
        - value
        - value-required
      properties:
        type:
          type: string
          const: map
        key-id:
          type: integer
        key:
          $ref: '#/components/schemas/Type'
        value-id:
          type: integer
        value:
          $ref: '#/components/schemas/Type'
        value-required:
          type: boolean
    BooleanTypeValue:
      type: boolean
      example: true
    IntegerTypeValue:
      type: integer
      example: 42
    LongTypeValue:
      type: integer
      format: int64
      example: 9223372036854776000
    FloatTypeValue:
      type: number
      format: float
      example: 3.14
    DoubleTypeValue:
      type: number
      format: double
      example: 123.456
    DecimalTypeValue:
      type: string
      description: Decimal type values are serialized as strings. Decimals with a positive scale serialize as numeric plain text, while decimals with a negative scale use scientific notation and the exponent will be equal to the negated scale. For instance, a decimal with a positive scale is '123.4500', with zero scale is '2', and with a negative scale is '2E+20'
      example: '123.4500'
    StringTypeValue:
      type: string
      example: hello
    UUIDTypeValue:
      type: string
      format: uuid
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      maxLength: 36
      minLength: 36
      description: UUID type values are serialized as a 36-character lowercase string in standard UUID format as specified by RFC-4122
      example: eb26bdb1-a1d8-4aa6-990e-da940875492c
    DateTypeValue:
      type: string
      format: date
      description: Date type values follow the 'YYYY-MM-DD' ISO-8601 standard date format
      example: '2007-12-03'
    TimeTypeValue:
      type: string
      description: Time type values follow the 'HH:MM:SS.ssssss' ISO-8601 format with microsecond precision
      example: '22:31:08.123456'
    TimestampTypeValue:
      type: string
      description: Timestamp type values follow the 'YYYY-MM-DDTHH:MM:SS.ssssss' ISO-8601 format with microsecond precision
      example: '2007-12-03T10:15:30.123456'
    TimestampTzTypeValue:
      type: string
      description: TimestampTz type values follow the 'YYYY-MM-DDTHH:MM:SS.ssssss+00:00' ISO-8601 format with microsecond precision, and a timezone offset (+00:00 for UTC)
      example: '2007-12-03T10:15:30.123456+00:00'
    TimestampNanoTypeValue:
      type: string
      description: Timestamp_ns type values follow the 'YYYY-MM-DDTHH:MM:SS.sssssssss' ISO-8601 format with nanosecond precision
      example: '2007-12-03T10:15:30.123456789'
    TimestampTzNanoTypeValue:
      type: string
      description: Timestamp_ns type values follow the 'YYYY-MM-DDTHH:MM:SS.sssssssss+00:00' ISO-8601 format with nanosecond precision, and a timezone offset (+00:00 for UTC)
      example: '2007-12-03T10:15:30.123456789+00:00'
    FixedTypeValue:
      type: string
      description: Fixed length type values are stored and serialized as an uppercase hexadecimal string preserving the fixed length
      example: 78797A
    BinaryTypeValue:
      type: string
      description: Binary type values are stored and serialized as an uppercase hexadecimal string
      example: 78797A
    PrimitiveTypeValue:
      oneOf:
        - $ref: '#/components/schemas/BooleanTypeValue'
        - $ref: '#/components/schemas/IntegerTypeValue'
        - $ref: '#/components/schemas/LongTypeValue'
        - $ref: '#/components/schemas/FloatTypeValue'
        - $ref: '#/components/schemas/DoubleTypeValue'
        - $ref: '#/components/schemas/DecimalTypeValue'
        - $ref: '#/components/schemas/StringTypeValue'
        - $ref: '#/components/schemas/UUIDTypeValue'
        - $ref: '#/components/schemas/DateTypeValue'
        - $ref: '#/components/schemas/TimeTypeValue'
        - $ref: '#/components/schemas/TimestampTypeValue'
        - $ref: '#/components/schemas/TimestampTzTypeValue'
        - $ref: '#/components/schemas/TimestampNanoTypeValue'
        - $ref: '#/components/schemas/TimestampTzNanoTypeValue'
        - $ref: '#/components/schemas/FixedTypeValue'
        - $ref: '#/components/schemas/BinaryTypeValue'
    StructField:
      type: object
      required:
        - id
        - name
        - type
        - required
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          $ref: '#/components/schemas/Type'
        required:
          type: boolean
        doc:
          type: string
        initial-default:
          $ref: '#/components/schemas/PrimitiveTypeValue'
        write-default:
          $ref: '#/components/schemas/PrimitiveTypeValue'
    Schema:
      allOf:
        - $ref: '#/components/schemas/StructType'
        - type: object
          properties:
            schema-id:
              type: integer
              readOnly: true
            identifier-field-ids:
              type: array
              items:
                type: integer
    Transform:
      type: string
      example:
        - identity
        - year
        - month
        - day
        - hour
        - bucket[256]
        - truncate[16]
    PartitionField:
      type: object
      required:
        - source-id
        - transform
        - name
      properties:
        field-id:
          type: integer
        source-id:
          type: integer
        name:
          type: string
        transform:
          $ref: '#/components/schemas/Transform'
    PartitionSpec:
      type: object
      required:
        - fields
      properties:
        spec-id:
          type: integer
          readOnly: true
        fields:
          type: array
          items:
            $ref: '#/components/schemas/PartitionField'
    SortDirection:
      type: string
      enum:
        - asc
        - desc
    NullOrder:
      type: string
      enum:
        - nulls-first
        - nulls-last
    SortField:
      type: object
      required:
        - source-id
        - transform
        - direction
        - null-order
      properties:
        source-id:
          type: integer
        transform:
          $ref: '#/components/schemas/Transform'
        direction:
          $ref: '#/components/schemas/SortDirection'
        null-order:
          $ref: '#/components/schemas/NullOrder'
    SortOrder:
      type: object
      required:
        - order-id
        - fields
      properties:
        order-id:
          type: integer
          readOnly: true
        fields:
          type: array
          items:
            $ref: '#/components/schemas/SortField'
    CreateTableRequest:
      type: object
      required:
        - name
        - schema
      properties:
        name:
          type: string
        location:
          type: string
        schema:
          $ref: '#/components/schemas/Schema'
        partition-spec:
          $ref: '#/components/schemas/PartitionSpec'
        write-order:
          $ref: '#/components/schemas/SortOrder'
        stage-create:
          type: boolean
        properties:
          type: object
          additionalProperties:
            type: string
    EncryptedKey:
      type: object
      required:
        - key-id
        - encrypted-key-metadata
      properties:
        key-id:
          type: string
        encrypted-key-metadata:
          type: string
          format: byte
          contentEncoding: base64
        encrypted-by-id:
          type: string
        properties:
          type: object
          additionalProperties:
            type: string
    Snapshot:
      type: object
      required:
        - snapshot-id
        - timestamp-ms
        - manifest-list
        - summary
      properties:
        snapshot-id:
          type: integer
          format: int64
        parent-snapshot-id:
          type: integer
          format: int64
        sequence-number:
          type: integer
          format: int64
        timestamp-ms:
          type: integer
          format: int64
        manifest-list:
          type: string
          description: Location of the snapshot's manifest list file
        first-row-id:
          type: integer
          format: int64
          description: The first _row_id assigned to the first row in the first data file in the first manifest
        added-rows:
          type: integer
          format: int64
          description: The upper bound of the number of rows with assigned row IDs
        summary:
