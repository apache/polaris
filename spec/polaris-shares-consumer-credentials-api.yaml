openapi: 3.0.3
info:
  title: Polaris Shares Consumer Credentials API
  version: 0.0.1
  description:
    Defines optional APIs for a service that issues its own client credentials to the
    external consumers of the Polaris Shares API (polaris-shares-api.yaml). A service that
    authenticates consumers another way, such as through an external identity provider,
    does not serve this API. A credential is an OAuth2 client credential pair, which the
    consumer exchanges for tokens at the token endpoint returned with it. This API is served
    under the same root as the Polaris Shares API. It is in beta and may change in a
    backward-incompatible way, and it is served only when the shares feature flag is
    enabled (off by default).
servers:
  - url: "{scheme}://{host}/api/shares-management/v1"
    description: Server URL when the port can be inferred from the scheme
    variables:
      scheme:
        description: The scheme of the URI, either http or https.
        default: https
      host:
        description: The host address for the specified server
        default: localhost
security:
  - OAuth2: []

paths:
  /external-consumers/{consumerName}/credentials:
    parameters:
      - name: consumerName
        in: path
        description: The name of the external consumer
        required: true
        schema:
          type: string
    get:
      operationId: listExternalConsumerCredentials
      summary: List a consumer's credentials
      parameters:
        - name: pageToken
          in: query
          required: false
          description: The continuation token returned with the previous page. Absent for the first page
          schema:
            type: string
        - name: pageSize
          in: query
          required: false
          description:
            Maximum number of items to return, at least 1. If absent, or larger than the service's
            maximum, the service's maximum is used
          schema:
            type: integer
            minimum: 1
      description:
        "List this consumer's credentials. Secrets are never
        returned by this operation."
      responses:
        200:
          description: The consumer's credentials, without secrets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerCredentials"
        403:
          description: "The caller does not have permission to read this external consumer"
        404:
          description: "The external consumer does not exist"
        501:
          description: "This realm's persistence does not support share records. Shares are unavailable until it is upgraded"
    post:
      operationId: createExternalConsumerCredential
      summary: Create a consumer credential
      description:
        "Create an OAuth2 client credential pair for this consumer. The client secret is returned
        only in this response. In this version a consumer has at most one active credential:
        creating another while one is active returns 409. To replace it, rotate it, or revoke it and create a
        new one. To give a party several independent credentials, create several external
        consumers, each with its own listing."
      responses:
        201:
          description: The created credential, including its secret (returned only here)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerCredentialWithSecret"
        403:
          description: "The caller does not have permission to manage this consumer's credentials"
        404:
          description: "The external consumer does not exist"
        409:
          description: "A credential is already active for this consumer (rotate or revoke it first), or the consumer was concurrently modified. Retry"
        501:
          description: "This realm's persistence does not support share records. Shares are unavailable until it is upgraded"

  /external-consumers/{consumerName}/credentials/{credentialId}:
    parameters:
      - name: consumerName
        in: path
        description: The name of the external consumer
        required: true
        schema:
          type: string
      - name: credentialId
        in: path
        description: The id of the credential
        required: true
        schema:
          type: string
    delete:
      operationId: revokeExternalConsumerCredential
      summary: Revoke a consumer credential
      description:
        "Revoke a credential immediately: its secrets stop authenticating at once. Tokens already
        issued live out their lifetime. The credential stays listed as revoked until a new
        one is created."
      responses:
        204:
          description: "Success, no content"
        403:
          description: "The caller does not have permission to manage this consumer's credentials"
        404:
          description: "The external consumer or credential does not exist"
        409:
          description: "The credential is not active (never issued, or already revoked), or the consumer was concurrently modified. Retry"
        501:
          description: "This realm's persistence does not support share records. Shares are unavailable until it is upgraded"

  /external-consumers/{consumerName}/credentials/{credentialId}/rotate:
    parameters:
      - name: consumerName
        in: path
        description: The name of the external consumer
        required: true
        schema:
          type: string
      - name: credentialId
        in: path
        description: The id of the credential
        required: true
        schema:
          type: string
    post:
      operationId: rotateExternalConsumerCredential
      summary: Rotate a consumer credential
      description:
        "Rotate a credential: create and return a new client credential pair (the new secret is
        returned only once). The previous credential stays valid for a service-defined
        overlap window, so a running consumer can switch over without interruption. A service
        without bounded credential expiry keeps the previous credential valid until the next
        rotation or revocation, and documents this."
      responses:
        201:
          description: The replacement credential, including its secret (returned only here)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerCredentialWithSecret"
        403:
          description: "The caller does not have permission to manage this consumer's credentials"
        404:
          description: "The external consumer or credential does not exist"
        409:
          description: "The credential is not active (never issued, or revoked), or the consumer was concurrently modified. Retry"
        501:
          description: "This realm's persistence does not support share records. Shares are unavailable until it is upgraded"

components:
  securitySchemes:
    OAuth2:
      type: oauth2
      description:
        OAuth2 client credentials for provider administrators, as in the Polaris Management API.
        Consumers do not use this scheme. The token URL below is illustrative.
      flows:
        clientCredentials:
          tokenUrl: "https://auth.example.invalid/oauth/tokens"
          scopes: {}

  schemas:
    ConsumerCredential:
      description: An OAuth2 client-credentials pair of an external consumer, without its secret
      type: object
      properties:
        credentialId:
          type: string
        clientId:
          type: string
        status:
          type: string
          description:
            EXPIRING appears only on services with bounded overlap support. A service
            without it reports ACTIVE or REVOKED only
          enum:
            - ACTIVE
            - EXPIRING
            - REVOKED
        createTimestamp:
          type: integer
          format: int64
          description: Epoch milliseconds of the creation time. Set by the service
          readOnly: true
        expirationTimestamp:
          type: integer
          format: int64
          readOnly: true
          description:
            Epoch milliseconds. Present when the credential is expiring, such as after a
            rotation overlap window
      required:
        - credentialId
        - clientId
        - status

    ConsumerCredentials:
      type: object
      properties:
        nextPageToken:
          type: string
          description:
            Present when more results exist. Absent on the last page
        credentials:
          type: array
          items:
            $ref: "#/components/schemas/ConsumerCredential"

    ConsumerCredentialWithSecret:
      description:
        A consumer credential including its secret and the token endpoint to use it at. Returned
        exactly once, at creation or rotation
      allOf:
        - $ref: "#/components/schemas/ConsumerCredential"
        - type: object
          properties:
            clientSecret:
              type: string
            oauth2ServerUri:
              type: string
              format: uri
              description:
                The token endpoint for the consumer's OAuth2 client credentials flow, set per
                deployment. The consumer sends its client id and secret (form body or Basic
                header) and the headers from its listing's endpoint configuration. No bearer
                token is needed
            scope:
              type: string
              description:
                The OAuth2 scope the consumer's client requests. Present when the deployment's
                token service expects a scope, because a stock client cannot discover it
                in-band
          required:
            - clientSecret
            - oauth2ServerUri
