openapi: 3.0.3
info:
  title: Polaris Shares API
  version: 0.0.1
  description:
    Defines the management APIs for sharing catalog content with parties that are not
    users of the catalog. A share lists what is shared. An external consumer represents a
    restricted identity that can only read the shares granted by its listings. A listing
    binds one consumer to one share and is the unit of audit. Consumers read shared tables
    with any Iceberg REST client, using the connection details from their listing's
    endpoint configuration. How a consumer authenticates is up to the service, as for the
    Iceberg REST API. A service that issues its own credentials to consumers can serve the
    optional Polaris Shares Consumer Credentials API
    (polaris-shares-consumer-credentials-api.yaml) for them. Shares are realm-level objects
    addressed by name, and each share is bound to one catalog. This API is in beta and may
    change in a backward-incompatible way, and it is served only when the shares feature
    flag is enabled (off by default).
servers:
  - url: "{scheme}://{host}/api/shares-management/v1"
    description: Server URL when the port can be inferred from the scheme
    variables:
      scheme:
        description: The scheme of the URI, either http or https.
        default: https
      host:
        description: The host address for the specified server
        default: localhost
security:
  - OAuth2: []

paths:
  /shares:
    get:
      operationId: listShares
      summary: List shares
      parameters:
        - name: pageToken
          in: query
          required: false
          description: The continuation token returned with the previous page. Absent for the first page
          schema:
            type: string
        - name: pageSize
          in: query
          required: false
          description:
            Maximum number of items to return, at least 1. If absent, or larger than the service's
            maximum, the service's maximum is used
          schema:
            type: integer
            minimum: 1
      description:
        "List all shares in this Polaris service."
      responses:
        200:
          description: A page of shares
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shares"
        403:
          description: "The caller does not have permission to list shares"
        501:
          description: "This realm's persistence does not support share records. Shares are unavailable until it is upgraded"
    post:
      operationId: createShare
      summary: Create a share
      description:
        "Create a share bound to the catalog named in the request. A new share has no members and no
        consumers until members are added and a listing is created. Not idempotent: a retry
        after a lost response returns 409 because the share exists. Fetch it by name."
      requestBody:
        description: The share to create
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShareRequest"
      responses:
        201:
          description: "Successful response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Share"
        400:
          description: "The share name is invalid, or the request is malformed"
        403:
          description: "The caller does not have permission to create a share, or to create a catalog role in the bound catalog"
        404:
          description: "The bound catalog does not exist"
        409:
          description: "A share with the specified name already exists"
        501:
          description: "This realm's persistence does not support share records. Shares are unavailable until it is upgraded"

  /shares/{shareName}:
    parameters:
      - name: shareName
        in: path
        description: The name of the share
        required: true
        schema:
          type: string
    get:
      operationId: getShare
      summary: Get a share
      description:
        "Get a share by name."
      responses:
        200:
          description: The share
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Share"
        403:
          description: "The caller does not have permission to read this share"
        404:
          description: "The share does not exist"
        501:
          description: "This realm's persistence does not support share records. Shares are unavailable until it is upgraded"
    put:
      operationId: updateShare
      summary: Update a share
      description:
        "Update a share's description or properties: an
        absent field changes nothing, an empty description clears it, properties are
        merged by key, and removeProperties lists the keys to drop. Share membership is
        updated through the members resource, not through this operation."
      requestBody:
        description: The update to apply
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateShareRequest"
      responses:
        200:
          description: The updated share
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Share"
        400:
          description: "A property key is both set and removed, or a reserved key is set or removed"
        403:
          description: "The caller does not have permission to update this share"
        404:
          description: "The share does not exist"
        409:
          description: "The share was concurrently modified. Fetch and retry"
        501:
          description: "This realm's persistence does not support share records. Shares are unavailable until it is upgraded"
    delete:
      operationId: deleteShare
      summary: Delete a share
      description:
        "Delete a share. Every listing of this share is
        revoked immediately. Consumer access through those listings ends with them."
      responses:
        204:
          description: "Success, no content"
        403:
          description: "The caller does not have permission to delete this share"
        404:
          description: "The share does not exist"
        409:
          description: "The share was concurrently modified. Fetch and retry"
        501:
          description: "This realm's persistence does not support share records. Shares are unavailable until it is upgraded"

  /shares/{shareName}/members:
    parameters:
      - name: shareName
        in: path
        description: The name of the share
        required: true
        schema:
          type: string
    get:
      operationId: listShareMembers
      summary: List share members
      parameters:
        - name: pageToken
          in: query
          required: false
          description: The continuation token returned with the previous page. Absent for the first page
          schema:
            type: string
        - name: pageSize
          in: query
          required: false
          description:
            Maximum number of items to return, at least 1. If absent, or larger than the service's
            maximum, the service's maximum is used
          schema:
            type: integer
            minimum: 1
      description:
        "List the members of a share."
      responses:
        200:
          description: A page of the share's members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareMembers"
        403:
          description: "The caller does not have permission to read this share"
        404:
          description: "The share does not exist"
        501:
          description: "This realm's persistence does not support share records. Shares are unavailable until it is upgraded"
    post:
      operationId: updateShareMembers
      summary: Update share members
      description:
        "Atomically apply a list of member additions and removals: either every update is applied or
        none is. A member may appear at most once in a batch. The batch is applied against one version of the share
        (currentEntityVersion if given, otherwise the version the service reads). Any
        concurrent change to the share, including another member update, returns 409. Fetch
        the share and retry. A stale currentEntityVersion returns 409 before any update is
        applied. Adding a member that is already present returns 400, and removing one that
        is absent returns 404. Every member must belong to the share's catalog. A removed
        member disappears from every consumer's view immediately. Read grants follow the
        membership record once the update commits. If granting fails partway, the service
        documents its behavior."
      requestBody:
        description: The membership updates to apply
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateShareMembersRequest"
      responses:
        200:
          description:
            The updated share, with its new entityVersion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Share"
        400:
          description: "An update in the list is invalid, a member appears more than once, or a member is outside the share's bound catalog"
        403:
          description: "The caller does not have permission to update this share's members"
        404:
          description: "The share, or a referenced member object, does not exist"
        409:
          description: "The share was concurrently modified. Fetch and retry"
        501:
          description: "This realm's persistence does not support share records. Shares are unavailable until it is upgraded"

  /shares/{shareName}/listings:
    parameters:
      - name: shareName
        in: path
        description: The name of the share
        required: true
        schema:
          type: string
    get:
      operationId: listListingsForShare
      summary: List listings of a share
      parameters:
        - name: pageToken
          in: query
          required: false
          description: The continuation token returned with the previous page. Absent for the first page
          schema:
            type: string
        - name: pageSize
          in: query
          required: false
          description:
            Maximum number of items to return, at least 1. If absent, or larger than the service's
            maximum, the service's maximum is used
          schema:
            type: integer
            minimum: 1
      description:
        "List the listings of a share."
      responses:
        200:
          description: A page of the share's listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listings"
        403:
          description: "The caller does not have permission to read this share's listings"
        404:
          description: "The share does not exist"
        501:
          description: "This realm's persistence does not support share records. Shares are unavailable until it is upgraded"
    post:
      operationId: createListing
      summary: Create a listing
      description:
        "Create a listing, which grants an external consumer access to this share. A listing is the
        only link between a consumer and a share, and every consumer read is audited against
        its listing. Not idempotent: a retry after a lost response returns 409 because the listing exists; fetch it by name."
      requestBody:
        description: The listing to create
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateListingRequest"
      responses:
        201:
          description: "Successful response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        400:
          description: "The listing name is invalid, or the request is malformed"
        403:
          description: "The caller does not have permission to create a listing on this share"
        404:
          description: "The share or the external consumer does not exist"
        409:
          description: "Conflict. ListingNameTaken: a listing with this name already exists on this share. ConsumerAlreadyListed: this consumer already has a listing on this share (at most one listing per consumer per share). Other conflicts, such as a concurrent change to the share or the consumer, use ShareServiceException"
          content:
            application/json:
              schema:
                $ref: "./iceberg-rest-catalog-open-api.yaml#/components/schemas/IcebergErrorResponse"
        501:
          description: "This realm's persistence does not support share records. Shares are unavailable until it is upgraded"

  /shares/{shareName}/listings/{listingName}:
    parameters:
      - name: shareName
        in: path
        description: The name of the share
        required: true
        schema:
          type: string
      - name: listingName
        in: path
        description: The name of the listing
        required: true
        schema:
          type: string
    get:
      operationId: getListing
      summary: Get a listing
      description:
        "Get a listing by name."
      responses:
        200:
          description: The listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        403:
          description: "The caller does not have permission to read this listing"
        404:
          description: "The share or listing does not exist"
        501:
          description: "This realm's persistence does not support share records. Shares are unavailable until it is upgraded"
    delete:
      operationId: deleteListing
      summary: Delete a listing
      description:
        "Delete a listing. The bound consumer's access to
        this share through this listing is revoked immediately."
      responses:
        204:
          description: "Success, no content"
        403:
          description: "The caller does not have permission to delete this listing"
        404:
          description: "The share or listing does not exist"
        409:
          description: "The share was concurrently modified. Fetch and retry"
        501:
          description: "This realm's persistence does not support share records. Shares are unavailable until it is upgraded"

  /shares/{shareName}/listings/{listingName}/endpoint-config:
    parameters:
      - name: shareName
        in: path
        description: The name of the share
        required: true
        schema:
          type: string
      - name: listingName
        in: path
        description: The name of the listing
        required: true
        schema:
          type: string
    get:
      operationId: getListingEndpointConfig
      summary: Get a listing's endpoint configuration
      description:
        "Get the connection material for a listing: the Iceberg REST Catalog endpoint and the
        settings the external consumer's client needs to read the share with any standard
        Iceberg REST client. The provider transmits this material to the consumer out of band."
      responses:
        200:
          description: The endpoint configuration for the listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndpointConfig"
        403:
          description: "The caller does not have permission to read this listing"
        404:
          description: "The share or listing does not exist"
        501:
          description: "This realm's persistence does not support share records. Shares are unavailable until it is upgraded"

  /external-consumers:
    get:
      operationId: listExternalConsumers
      summary: List external consumers
      parameters:
        - name: pageToken
          in: query
          required: false
          description: The continuation token returned with the previous page. Absent for the first page
          schema:
            type: string
        - name: pageSize
          in: query
          required: false
          description:
            Maximum number of items to return, at least 1. If absent, or larger than the service's
            maximum, the service's maximum is used. A page may contain fewer items than
            requested, or none, while more remain. Keep paging until no continuation token is
            returned
          schema:
            type: integer
            minimum: 1
      description:
        "List all external consumers in this Polaris service."
      responses:
        200:
          description: A page of external consumers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalConsumers"
        403:
          description: "The caller does not have permission to list external consumers"
        501:
          description: "This realm's persistence does not support share records. Shares are unavailable until it is upgraded"
    post:
      operationId: createExternalConsumer
      summary: Create an external consumer
      description:
        "Create an external consumer, which represents a restricted identity of this realm for a
        party that is not a user of the catalog. It can only read the shares granted by its
        listings, each under that share's role. It cannot be granted any other role or
        privilege. How it authenticates is up to the service."
      requestBody:
        description: The external consumer to create
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExternalConsumerRequest"
      responses:
        201:
          description: "Successful response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalConsumer"
        400:
          description: "The consumer name is invalid, or the request is malformed"
        403:
          description: "The caller does not have permission to create an external consumer"
        409:
          description: "An external consumer with the specified name already exists"
        501:
          description: "This realm's persistence does not support share records. Shares are unavailable until it is upgraded"

  /external-consumers/{consumerName}:
    parameters:
      - name: consumerName
        in: path
        description: The name of the external consumer
        required: true
        schema:
          type: string
    get:
      operationId: getExternalConsumer
      summary: Get an external consumer
      description:
        "Get an external consumer by name."
      responses:
        200:
          description: The external consumer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalConsumer"
        403:
          description: "The caller does not have permission to read this external consumer"
        404:
          description: "The external consumer does not exist"
        501:
          description: "This realm's persistence does not support share records. Shares are unavailable until it is upgraded"
    delete:
      operationId: deleteExternalConsumer
      summary: Delete an external consumer
      description:
        "Delete an external consumer. Every listing bound to this consumer is revoked, and any
        credentials the service issued to it are invalidated, immediately and irreversibly."
      responses:
        204:
          description: "Success, no content"
        403:
          description: "The caller does not have permission to delete this external consumer"
        404:
          description: "The external consumer does not exist"
        409:
          description: "A share the consumer is listed on was concurrently modified. Retry"
        501:
          description: "This realm's persistence does not support share records. Shares are unavailable until it is upgraded"

  /external-consumers/{consumerName}/listings:
    parameters:
      - name: consumerName
        in: path
        description: The name of the external consumer
        required: true
        schema:
          type: string
    get:
      operationId: listListingsForConsumer
      summary: List listings for a consumer
      parameters:
        - name: pageToken
          in: query
          required: false
          description: The continuation token returned with the previous page. Absent for the first page
          schema:
            type: string
        - name: pageSize
          in: query
          required: false
          description:
            Maximum number of items to return, at least 1. If absent, or larger than the service's
            maximum, the service's maximum is used
          schema:
            type: integer
            minimum: 1
      description:
        "List every listing bound to this external consumer,
        across all shares."
      responses:
        200:
          description: A page of the listings bound to this consumer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listings"
        403:
          description: "The caller does not have permission to read this external consumer"
        404:
          description: "The external consumer does not exist"
        501:
          description: "This realm's persistence does not support share records. Shares are unavailable until it is upgraded"

components:
  securitySchemes:
    OAuth2:
      type: oauth2
      description:
        OAuth2 client credentials for provider administrators, as in the Polaris Management API.
        Consumers do not use this scheme. The token URL below is illustrative.
      flows:
        clientCredentials:
          tokenUrl: "https://auth.example.invalid/oauth/tokens"
          scopes: {}

  schemas:
    Share:
      description:
        A named, realm-level container that lists shared objects. A share is bound to one catalog,
        and its members are objects in that catalog. Share names are unique across the
        service.
      type: object
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]*$"
          maxLength: 256
          description: The share's name, unique across the realm's shares. Letters, digits, underscore and hyphen, starting with a letter or digit, at most 256 characters
        catalogName:
          type: string
          description:
            The catalog this share is bound to, whose objects it can contain. Required at creation,
            immutable afterwards. Exactly one catalog is bound
        description:
          type: string
        properties:
          type: object
          additionalProperties:
            type: string
          description:
            User-defined properties. Keys with the reserved "share." prefix belong to the service. They
            are never returned here and are rejected (400) when set
        createTimestamp:
          type: string
          format: date-time
          description: The creation time, in ISO 8601 (RFC 3339) format. Set by the service
          readOnly: true
        lastUpdateTimestamp:
          type: string
          format: date-time
          description: The last update time, in ISO 8601 (RFC 3339) format. Set by the service
          readOnly: true
        entityVersion:
          type: integer
          description:
            The share's version, incremented on every change. Send it as currentEntityVersion with an
            update to detect concurrent modification
      required:
        - name
        - catalogName

    Shares:
      type: object
      properties:
        nextPageToken:
          type: string
          description:
            Present when more results exist. Absent on the last page
        shares:
          type: array
          items:
            $ref: "#/components/schemas/Share"

    CreateShareRequest:
      type: object
      properties:
        share:
          $ref: "#/components/schemas/Share"
      required:
        - share

    UpdateShareRequest:
      description:
        Updates to apply to a share's description or properties. Every field is
        optional and an absent field changes nothing. The fields present are applied
        together, under the version check when currentEntityVersion is given
      type: object
      properties:
        currentEntityVersion:
          type: integer
          description:
            The version of the object onto which this update is applied. If the object
            changed, the update will fail and the caller should retry after fetching the
            latest version
        description:
          type: string
          description:
            The new description. An empty string clears the description. An absent
            field leaves it unchanged
        properties:
          type: object
          additionalProperties:
            type: string
          description:
            Properties to set, merged into the share's properties by key. Other keys are kept. An absent
            or empty map sets nothing. Keys with the reserved "share." prefix are rejected
            (400)
        removeProperties:
          type: array
          items:
            type: string
          description:
            Keys to remove from the share's properties. A key that is not set is ignored. A key both set
            in properties and listed here is rejected (400), as is a key with the reserved
            "share." prefix

    ShareMember:
      description:
        A member of a share. Consumers see the member under its canonical identity in the share's
        catalog. A member is pinned to the object's stable ID when it is added, so a renamed
        object stays a member under its new name, and a new object that reuses an old name is
        not a member. Aliasing (exposing a member under another identity) is not supported in
        this version.
      type: object
      properties:
        type:
          type: string
          description:
            The member type. TABLE is the only type defined. The set is open, and a service rejects
            types it does not support
        canonical:
          $ref: "#/components/schemas/MemberIdentity"
      required:
        - type
        - canonical

    MemberIdentity:
      description:
        The identity of a member object, as a namespace and a name inside the share's
        bound catalog. The catalog is the share's and is not repeated here. It is the
        identifier a consumer's Iceberg REST client uses for the member
      type: object
      properties:
        namespace:
          type: array
          items:
            type: string
        name:
          type: string
      required:
        - namespace
        - name

    ShareMembers:
      type: object
      properties:
        nextPageToken:
          type: string
          description:
            Present when more results exist. Absent on the last page
        members:
          type: array
          items:
            $ref: "#/components/schemas/ShareMember"

    UpdateShareMembersRequest:
      description: A list of membership updates, applied atomically. Each member may appear at most once
      type: object
      properties:
        currentEntityVersion:
          type: integer
          description:
            The share version this batch applies to. If the share has changed, the request returns 409.
            Fetch the latest version and retry. Optional. Without it, the service applies the
            batch against the version it reads, and a concurrent change still returns 409
        updates:
          type: array
          items:
            $ref: "#/components/schemas/ShareMemberUpdate"
      required:
        - updates

    ShareMemberUpdate:
      type: object
      properties:
        action:
          type: string
          enum:
            - ADD
            - REMOVE
        member:
          $ref: "#/components/schemas/ShareMember"
      required:
        - action
        - member

    ExternalConsumer:
      description:
        Represents a restricted identity of this realm for a party that is not a user of the catalog.
        It can only read the shares granted by its listings
      type: object
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]*$"
          maxLength: 256
          description: The consumer's name, unique across the realm's consumers. Letters, digits, underscore and hyphen, starting with a letter or digit, at most 256 characters
        description:
          type: string
        properties:
          type: object
          additionalProperties:
            type: string
          description:
            User-defined properties. Keys with the reserved "share." prefix belong to the service. They
            are never returned here and are rejected (400) when set
        createTimestamp:
          type: string
          format: date-time
          description: The creation time, in ISO 8601 (RFC 3339) format. Set by the service
          readOnly: true
        lastUpdateTimestamp:
          type: string
          format: date-time
          description: The last update time, in ISO 8601 (RFC 3339) format. Set by the service
          readOnly: true
        entityVersion:
          type: integer
          description: The version of the consumer object, incremented by every change
      required:
        - name

    ExternalConsumers:
      type: object
      properties:
        nextPageToken:
          type: string
          description:
            Present when more results exist. Absent on the last page
        externalConsumers:
          type: array
          items:
            $ref: "#/components/schemas/ExternalConsumer"

    CreateExternalConsumerRequest:
      type: object
      properties:
        externalConsumer:
          $ref: "#/components/schemas/ExternalConsumer"
      required:
        - externalConsumer

    Listing:
      description:
        The binding between an external consumer and a share. The only path that
        connects a consumer to a share, and the unit of audit
      type: object
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]*$"
          maxLength: 256
          description: The listing's name, unique across the share's listings. Letters, digits, underscore and hyphen, starting with a letter or digit, at most 256 characters
        shareName:
          type: string
        consumerName:
          type: string
        description:
          type: string
        properties:
          type: object
          additionalProperties:
            type: string
          description:
            User-defined properties. Keys with the reserved "share." prefix belong to the service. They
            are never returned here and are rejected (400) when set
        createTimestamp:
          type: string
          format: date-time
          description: The creation time, in ISO 8601 (RFC 3339) format. Set by the service
          readOnly: true
        entityVersion:
          type: integer
          description: The version of the listing object, incremented by every change and carried into audit attribution
      required:
        - name
        - shareName
        - consumerName

    Listings:
      type: object
      properties:
        nextPageToken:
          type: string
          description:
            Present when more results exist. Absent on the last page
        listings:
          type: array
          items:
            $ref: "#/components/schemas/Listing"

    CreateListingRequest:
      type: object
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]*$"
          maxLength: 256
          description: The listing's name, unique across the share's listings. Letters, digits, underscore and hyphen, starting with a letter or digit, at most 256 characters
        consumerName:
          type: string
        description:
          type: string
        properties:
          type: object
          additionalProperties:
            type: string
          description:
            User-defined properties. Keys with the reserved "share." prefix belong to the service. They
            are never returned here and are rejected (400) when set
      required:
        - name
        - consumerName

    EndpointConfig:
      description:
        The connection material an external consumer uses to read a share with a
        standard Iceberg REST Catalog client
      type: object
      properties:
        catalogEndpoint:
          type: string
          format: uri
          description: The base URI of the Iceberg REST Catalog endpoint serving the share
        warehouse:
          type: string
          description: The warehouse value the consumer's client sends at configuration discovery
        additionalHeaders:
          type: object
          additionalProperties:
            type: string
          description:
            HTTP headers the consumer's client sends on every request to the service, for
            example a realm-selection header the deployment uses
      required:
        - catalogEndpoint
        - warehouse
