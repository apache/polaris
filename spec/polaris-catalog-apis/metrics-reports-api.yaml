---
paths:

  /polaris/v1/{prefix}/metrics/query:
    parameters:
      - $ref: '../iceberg-rest-catalog-open-api.yaml#/components/parameters/prefix'

    post:
      tags:
        - Metrics Reports API
      summary: Query metrics reports for one or more tables
      operationId: queryTableMetrics
      description: |
        **Experimental / Beta:** The Metrics Reports API is experimental and may change in a
        backward-incompatible way in any future release. It should not be used in production
        environments.

        Returns persisted metrics reports for the tables listed in the request body. All requested
        tables must belong to the catalog identified by `prefix`. The required `metricType`
        selects between scan reports (produced during table reads) and commit reports (produced
        during table writes). Results from all requested tables are merged into a single page,
        ordered by timestamp descending, and disambiguated by the `table` field on each report.

        Requires the TABLE_READ_METRICS privilege on every requested table. Durable persistence
        backing for this API is provided by the polaris-extensions-metrics-reports-jdbc extension;
        without it the endpoint returns HTTP 200 with an empty `reports` list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryMetricsRequest'
      responses:
        200:
          description: Paginated list of metrics reports
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMetricsResponse'
        400:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/BadRequestErrorResponse'
        401:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/UnauthorizedResponse'
        403:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/ForbiddenResponse'
        404:
          description: Not Found - The catalog, namespace, or table does not exist
          content:
            application/json:
              schema:
                $ref: '../iceberg-rest-catalog-open-api.yaml#/components/schemas/IcebergErrorResponse'
              examples:
                TableNotFound:
                  $ref: '../iceberg-rest-catalog-open-api.yaml#/components/examples/NoSuchTableError'
        503:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/ServiceUnavailableResponse'
        5XX:
          $ref: '../iceberg-rest-catalog-open-api.yaml#/components/responses/ServerErrorResponse'

components:
  schemas:
    TableRef:
      type: object
      description: Identifies a table by its namespace levels and name
      required:
        - namespace
        - name
      properties:
        namespace:
          type: array
          items:
            type: string
          description: Namespace levels, e.g. ["a", "b"] for namespace a.b
        name:
          type: string

    QueryMetricsRequest:
      type: object
      required:
        - metricType
        - tables
      properties:
        metricType:
          type: string
          enum: [scan, commit]
          description: Type of metrics to retrieve
        tables:
          type: array
          minItems: 1
          description: >
            Tables to query. All tables must belong to the catalog identified by prefix in the
            path.
          items:
            $ref: '#/components/schemas/TableRef'
        pageToken:
          type: string
          description: Opaque cursor from a previous response's nextPageToken field
        pageSize:
          type: integer
          minimum: 1
          description: >
            Maximum number of results to return per page. As with other paginated Polaris APIs,
            omitting this (and pageToken) returns all matching results in a single page.
        snapshotId:
          type: integer
          format: int64
          description: >
            Filter results to a specific snapshot ID. Since snapshot IDs are scoped to a single
            table, this is only valid when exactly one table is requested; the request fails with
            400 otherwise.
        timestampFrom:
          type: integer
          format: int64
          description: Inclusive lower bound on report timestamp (Unix epoch milliseconds)
        timestampTo:
          type: integer
          format: int64
          description: Exclusive upper bound on report timestamp (Unix epoch milliseconds)

    ListMetricsResponse:
      type: object
      required:
        - reports
      properties:
        nextPageToken:
          type: string
          nullable: true
          description: >
            Opaque cursor for fetching the next page. Null or absent when no further pages exist.
        reports:
          type: array
          items:
            $ref: '#/components/schemas/MetricsReport'

    MetricsReport:
      type: object
      description: >
        Envelope for a single persisted Iceberg metrics report (scan or commit). The `payload` is
        an opaque JSON object so fields can be added without requiring a change to this API's
        schema.
      required:
        - metricType
        - table
        - timestampMs
        - payload
      properties:
        metricType:
          type: string
          enum: [scan, commit]
          description: Matches the requested metricType
        table:
          $ref: '#/components/schemas/TableRef'
        timestampMs:
          type: integer
          format: int64
          description: Server-side timestamp when the report was received (Unix epoch milliseconds)
        snapshotId:
          type: integer
          format: int64
          nullable: true
          description: Snapshot ID associated with the report, if any
        request:
          $ref: '#/components/schemas/MetricsRequest'
          nullable: true
        payload:
          type: object
          additionalProperties: true
          description: >
            Opaque metrics report payload, e.g. `{"type": "iceberg.metrics.scan", "version": 1,
            "data": {...}}`. The payload is a projection reconstructed from the persisted metrics
            record, not the original report as received: `data` contains only the metric fields
            the persistence backend stores, and fields of the original report that are not
            persisted (e.g. custom metrics or report metadata) are not returned. Clients must not
            assume every field of the original Iceberg report is present.

    MetricsRequest:
      type: object
      description: Request context for correlation with logs and traces
      properties:
        requestId:
          type: string
          nullable: true
        otelTraceId:
          type: string
          nullable: true
          description: OpenTelemetry trace ID
        otelSpanId:
          type: string
          nullable: true
          description: OpenTelemetry span ID
