# Polaris server configuration, read by bin/server at startup.
#
# Every property in this file is commented out, so the server uses its built-in defaults.
# To change a setting, remove the leading '#' and edit the value. Unless noted otherwise, the
# value shown is the default.
#
# System properties (-Dname=value) and environment variables take precedence over this file.
#
# This file only lists a few commonly changed settings. For the full list, see
# https://polaris.apache.org/releases/latest/configuration/

# ---- Ports ----

# Port of the REST APIs.
#quarkus.http.port=8181
# Port of the management interface (health checks and metrics).
#quarkus.management.port=8182

# ---- Realms ----

# Comma-separated list of allowed realms. The first one is the default realm.
#polaris.realm-context.realms=POLARIS
# Name of the request header that carries the realm.
#polaris.realm-context.header-name=Polaris-Realm
# Set to true in production, so that requests without the realm header are rejected instead of
# being served by the default realm.
#polaris.realm-context.require-header=false

# ---- Persistence ----

# The default in-memory metastore loses all data when the server stops. Use a durable metastore
# in production.
#polaris.persistence.type=in-memory

# Example for the relational JDBC metastore (these values are not defaults). The admin tool must
# use the same settings, see admin/config/application.properties. The schema must exist before the
# realms are bootstrapped with the admin tool.
#polaris.persistence.type=relational-jdbc
#quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/polaris
#quarkus.datasource.username=
#quarkus.datasource.password=
# Database schema holding the Polaris tables (this value is the default).
#quarkus.datasource.jdbc.additional-jdbc-properties.currentSchema=POLARIS_SCHEMA

# ---- Authentication ----

# By default, tokens are signed with an RSA key pair that is generated at startup. Provide your own
# keys in production, in particular when running more than one Polaris server.
#polaris.authentication.token-broker.type=rsa-key-pair
# Example paths (these values are not defaults).
#polaris.authentication.token-broker.rsa-key-pair.public-key-file=/path/to/public.key
#polaris.authentication.token-broker.rsa-key-pair.private-key-file=/path/to/private.key
# Maximum lifespan of the generated tokens.
#polaris.authentication.token-broker.max-token-generation=PT1H
