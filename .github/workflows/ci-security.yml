# Security scans for GitHub Actions workflow files. Container image scanning
# lives in ci.yml (docker-image-scan) because it depends on the built image.

name: Security

on:
  pull_request:
    branches: [ "main", "release/*", "feature/*" ]
  push:
    branches: [ "main", "release/*", "feature/*" ]
  schedule:
    - cron: '16 4 * * 1'

permissions:
  contents: read

jobs:
  zizmor:
    name: Zizmor
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        if: github.repository_owner == 'apache'
        with:
          # Intentionally leave the defaults, which is to report even informational/low
          # severity/confidence findings.
          #min-severity:
          #min-confidence:
          advanced-security: ${{ github.event_name != 'pull_request' }}
          annotations: ${{ github.event_name == 'pull_request' }}

  codeql:
    name: CodeQL Analyze
    if: github.repository_owner == 'apache'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: actions

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:actions"
