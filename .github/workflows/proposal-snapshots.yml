name: Proposal snapshots

on:
  pull_request:
    paths:
      - 'tools/gdoc-snapshot/**'
      - 'proposals/**'
      - 'Makefile'
      - '.github/workflows/proposal-snapshots.yml'
  push:
    branches: ['**']
    paths:
      - 'tools/gdoc-snapshot/**'
      - 'proposals/**'
      - 'Makefile'
      - '.github/workflows/proposal-snapshots.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proposal-snapshots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Proposal tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install YAML parser
        run: python3 -m pip install -r tools/gdoc-snapshot/requirements.txt
      - name: Test build behavior with controlled exports
        run: python3 -m unittest discover -s tools/gdoc-snapshot -p 'test_*.py' -v
      - name: Verify PR snapshots offline
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: make proposal-snapshots-check PROPOSAL_BASE_REF="$BASE_REF"
      - name: Verify default branch snapshots offline
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        run: make proposal-snapshots-check

  capture:
    name: Capture pending versions on the contributor branch
    needs: verify
    if: github.event_name != 'pull_request' && github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - name: Install YAML parser
        run: python3 -m pip install -r tools/gdoc-snapshot/requirements.txt
      - name: Fill pending YAML entries
        env:
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          if [[ "$BEFORE" =~ ^[0-9a-f]{40}$ && "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            make proposal-snapshots PROPOSAL_BASE_REF="$BEFORE"
          else
            make proposal-snapshots
          fi
          make proposal-snapshots-check
      - name: Commit and push generated files
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          git add -- ':(glob)proposals/*/manifest.yaml' ':(glob)proposals/*/snapshots/**'
          if git diff --cached --quiet; then
            echo 'All proposal versions are already captured.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh auth setup-git
          remote_head=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          if [[ "$remote_head" != "$EXPECTED_HEAD" ]]; then
            echo 'The branch advanced during capture. Nothing was pushed. The newer push will retry.' >&2
            exit 1
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'docs: capture pending proposal snapshots'
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "Generated snapshots committed at $(git rev-parse HEAD)." >> "$GITHUB_STEP_SUMMARY"
