name: Proposal snapshots

on:
  pull_request:
    paths:
      - 'tools/gdoc-snapshot/**'
      - 'proposals/**'
      - '.github/workflows/proposal-snapshots.yml'
  push:
    paths:
      - 'tools/gdoc-snapshot/**'
      - 'proposals/**'
      - '.github/workflows/proposal-snapshots.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Offline proposal checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test importer behavior with controlled exports
        run: python3 -m unittest discover -s tools/gdoc-snapshot -p 'test_*.py' -v
      - name: Verify every committed proposal snapshot
        shell: bash
        run: |
          for manifest in proposals/*/manifest.json; do
            python3 tools/gdoc-snapshot/gdoc_snapshot.py check "$manifest"
          done

  repository-checks:
    name: Repository contribution checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Format, compile, and audit source headers
        run: ./gradlew format compileAll rat
      - name: Verify formatting produced no changes
        run: git diff --exit-code
